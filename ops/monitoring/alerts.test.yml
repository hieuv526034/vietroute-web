rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="vietroute",instance="node-a"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: VietRouteInstanceUnavailable
        exp_alerts:
          - exp_labels:
              job: vietroute
              instance: node-a
              severity: critical
            exp_annotations:
              summary: 'Không scrape được instance VietRoute'
              description: 'Kiểm tra Events/Logs Render, token scrape, mạng và trạng thái JVM. Endpoint lỗi không luôn đồng nghĩa JVM đã chết.'
  - interval: 1m
    input_series:
      - series: 'vietroute_worker_claim_age{job="vietroute",instance="node-a"}'
        values: '-1+0x5'
      - series: 'vietroute_worker_enabled{job="vietroute",instance="node-a"}'
        values: '0+0x5'
      - series: 'vietroute_database_available{job="vietroute",instance="node-a"}'
        values: '0+0x5'
      - series: 'vietroute_database_probe_enabled{job="vietroute",instance="node-a"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: VietRouteWorkerNotClaiming
        exp_alerts: []
      - eval_time: 4m
        alertname: VietRouteDatabaseUnavailable
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'vietroute_database_available{job="vietroute",instance="node-a"}'
        values: '0+0x5 1+0x5'
      - series: 'vietroute_database_probe_enabled{job="vietroute",instance="node-a"}'
        values: '1+0x11'
    alert_rule_test:
      - eval_time: 3m
        alertname: VietRouteDatabaseUnavailable
        exp_alerts:
          - exp_labels:
              job: vietroute
              instance: node-a
              severity: critical
            exp_annotations:
              summary: 'Probe database VietRoute thất bại'
      - eval_time: 8m
        alertname: VietRouteDatabaseUnavailable
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'vietroute_worker_claim_age{job="vietroute",instance="node-a"}'
        values: '-1+0x6'
      - series: 'vietroute_worker_enabled{job="vietroute",instance="node-a"}'
        values: '1+0x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: VietRouteWorkerNotClaiming
        exp_alerts:
          - exp_labels:
              job: vietroute
              instance: node-a
              severity: warning
            exp_annotations:
              summary: 'Worker bật nhưng không có claim DB thành công gần đây'
