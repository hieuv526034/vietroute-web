services:
  - type: web
    name: vietroute-web
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - src/main/**
        - pom.xml
        - mvnw
        - .mvn/**
        - Dockerfile
        - .dockerignore
        - docker/**
        - render.yaml
        - .github/workflows/build.yml
    envVars:
      - key: PORT
        value: "10000"
      - key: VIETROUTE_DB_URL
        sync: false
      - key: VIETROUTE_DB_USER
        sync: false
      - key: VIETROUTE_DB_PASSWORD
        sync: false
      - key: VIETROUTE_ENV
        value: production
      - key: VIETROUTE_DB_INIT_ENABLED
        value: "true"
      - key: VIETROUTE_COOKIE_SECURE
        value: "true"
      - key: VIETROUTE_JWT_SECRET
        generateValue: true
      - key: VIETROUTE_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: VIETROUTE_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
