<!doctype html>
<html
    lang="vi"
    xmlns:th="http://www.thymeleaf.org"
>
    <body>
        <section
            id="access-scopes-section"
            class="card p-4"
            hidden
            aria-labelledby="scopes-title"
            th:fragment="scopes"
        >
            <h2
                id="scopes-title"
                class="h4"
                th:text="#{ui.scope.title}"
            ></h2>

            <p
                id="scopes-feedback"
                class="feedback"
                role="alert"
                hidden
            ></p>
            <fieldset
                id="scopes-controls"
                class="border-0 p-0 m-0"
            >
                <form
                    id="scopes-search"
                    class="table-filter mb-3"
                >
                    <div>
                        <label
                            for="scope-query"
                            th:text="#{ui.accessRoles.registrySearch}"
                        ></label>
                        <input
                            id="scope-query"
                            type="search"
                            maxlength="160"
                            class="form-control"
                        />
                    </div>
                    <div>
                        <label
                            for="scope-active-filter"
                            th:text="#{ui.foundation.active}"
                        ></label>
                        <select
                            id="scope-active-filter"
                            class="form-select"
                        >
                            <option
                                value=""
                                th:text="#{ui.ops.all}"
                            ></option>
                            <option
                                value="true"
                                th:text="#{ui.monitoring.on}"
                            ></option>
                            <option
                                value="false"
                                th:text="#{ui.monitoring.off}"
                            ></option>
                        </select>
                    </div>
                    <button
                        type="submit"
                        class="button button-outline"
                        th:text="#{ui.ops.filter}"
                    ></button>
                    <button
                        id="scopes-refresh"
                        type="button"
                        class="button button-outline"
                        th:text="#{ui.ops.refresh}"
                    ></button>
                    <button
                        id="scope-create"
                        type="button"
                        class="button"
                        th:text="#{ui.scope.create}"
                    ></button>
                </form>
                <p
                    id="scope-status"
                    role="status"
                ></p>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th th:text="#{ui.foundation.code}"></th>
                                <th th:text="#{ui.foundation.nameVi}"></th>
                                <th th:text="#{ui.foundation.active}"></th>
                                <th
                                    class="table-actions"
                                    th:text="#{ui.ops.actions}"
                                ></th>
                            </tr>
                        </thead>
                        <tbody id="scopes-body"></tbody>
                    </table>
                </div>
                <nav th:replace="~{fragments/pagination :: pager('scopes', 20)}"></nav>
            </fieldset>
        </section>

        <dialog
            id="scope-members-dialog"
            class="workspace-dialog workspace-dialog-wide"
            aria-labelledby="scope-members-title"
            th:fragment="membersDialog"
        >
            <div class="dialog-heading">
                <h2
                    id="scope-members-title"
                    class="h4"
                    th:text="#{ui.scope.members}"
                ></h2>
                <button
                    type="button"
                    class="dialog-close"
                    data-dialog-close
                    th:attr="aria-label=#{ui.ops.close}"
                >
                    ×
                </button>
            </div>
            <p
                id="scope-members-feedback"
                class="feedback"
                role="alert"
                hidden
            ></p>
            <fieldset
                id="scope-members-controls"
                class="dialog-controls border-0 p-0 m-0"
            >
                <div class="toolbar-actions mb-3">
                    <button
                        id="scope-member-create"
                        type="button"
                        class="button"
                        th:text="#{ui.scope.assign}"
                    ></button>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th th:text="#{ui.ops.username}"></th>
                                <th th:text="#{ui.ops.role}"></th>
                                <th th:text="#{ui.foundation.active}"></th>
                                <th
                                    class="table-actions"
                                    th:text="#{ui.ops.actions}"
                                ></th>
                            </tr>
                        </thead>
                        <tbody id="scope-members-body"></tbody>
                    </table>
                </div>
                <nav th:replace="~{fragments/pagination :: pager('scope-members', 20)}"></nav>

                <div class="dialog-actions">
                    <button
                        type="button"
                        class="button button-outline"
                        data-dialog-close
                        th:text="#{ui.ops.close}"
                    ></button>
                </div>
            </fieldset>
        </dialog>
        <dialog
            id="scope-dialog"
            class="workspace-dialog"
            aria-labelledby="scope-dialog-title"
            th:fragment="scopeDialog"
        >
            <div class="dialog-heading">
                <h2
                    id="scope-dialog-title"
                    class="h4"
                    th:text="#{ui.scope.edit}"
                ></h2>
                <button
                    type="button"
                    class="dialog-close"
                    data-dialog-close
                    th:attr="aria-label=#{ui.ops.close}"
                >
                    ×
                </button>
            </div>
            <form
                id="scope-form"
                data-validate
            >
                <fieldset
                    id="scope-form-controls"
                    class="border-0 p-0 m-0"
                >
                    <label
                        for="scope-code"
                        class="form-label"
                        th:text="#{ui.foundation.code}"
                    ></label>
                    <input
                        id="scope-code"
                        name="code"
                        class="form-control"
                        required
                        maxlength="50"
                        pattern="[A-Z][A-Z0-9_]{1,49}"
                    />
                    <label
                        for="scope-name-vi"
                        class="form-label"
                        th:text="#{ui.foundation.nameVi}"
                    ></label>
                    <input
                        id="scope-name-vi"
                        name="nameVi"
                        class="form-control"
                        required
                        maxlength="120"
                    />
                    <label
                        for="scope-name-en"
                        class="form-label"
                        th:text="#{ui.foundation.nameEn}"
                    ></label>
                    <input
                        id="scope-name-en"
                        name="nameEn"
                        class="form-control"
                        required
                        maxlength="120"
                    />
                    <label class="d-flex gap-2 mt-3">
                        <input
                            id="scope-active"
                            name="active"
                            type="checkbox"
                            class="form-check-input"
                        />
                        <span th:text="#{ui.foundation.active}"></span>
                    </label>
                    <p
                        id="scope-form-feedback"
                        class="feedback"
                        role="alert"
                        hidden
                    ></p>
                    <div class="dialog-actions">
                        <button
                            type="button"
                            class="button button-outline"
                            data-dialog-close
                            th:text="#{ui.catalog.cancel}"
                        ></button>
                        <button
                            type="submit"
                            class="button"
                            th:text="#{ui.catalog.save}"
                        ></button>
                    </div>
                </fieldset>
            </form>
        </dialog>
        <dialog
            id="scope-member-dialog"
            class="workspace-dialog"
            aria-labelledby="scope-member-dialog-title"
            th:fragment="memberDialog"
        >
            <div class="dialog-heading">
                <h2
                    id="scope-member-dialog-title"
                    class="h4"
                    th:text="#{ui.scope.assign}"
                ></h2>
                <button
                    type="button"
                    class="dialog-close"
                    data-dialog-close
                    th:attr="aria-label=#{ui.ops.close}"
                >
                    ×
                </button>
            </div>
            <form
                id="scope-member-form"
                data-validate
            >
                <fieldset
                    id="scope-member-controls"
                    class="border-0 p-0 m-0"
                >
                    <div id="scope-user-search-fields">
                        <label
                            for="scope-user-query"
                            class="form-label"
                            th:text="#{ui.ops.usernamePrefix}"
                        ></label>
                        <div class="picker-search">
                            <input
                                id="scope-user-query"
                                class="form-control"
                                maxlength="32"
                                pattern="[A-Za-z0-9]{0,32}"
                            />
                            <button
                                id="scope-user-search"
                                type="button"
                                class="button button-outline"
                                th:text="#{ui.ops.filter}"
                            ></button>
                        </div>
                    </div>
                    <label
                        for="scope-user"
                        class="form-label"
                        th:text="#{ui.ops.username}"
                    ></label>
                    <select
                        id="scope-user"
                        name="userId"
                        class="form-select"
                        required
                    ></select>
                    <p
                        class="muted"
                        th:text="#{ui.scope.userHint}"
                    ></p>
                    <label
                        for="scope-role-query"
                        class="form-label"
                        th:text="#{ui.accessRoles.search}"
                    ></label>
                    <input
                        id="scope-role-query"
                        type="search"
                        class="form-control"
                        maxlength="160"
                    />
                    <p
                        id="scope-role-count"
                        role="status"
                        class="muted"
                    ></p>
                    <fieldset
                        id="scope-role-options"
                        class="border-0 p-0 m-0"
                    >
                        <legend
                            class="form-label h6"
                            th:text="#{ui.ops.role}"
                        ></legend>
                    </fieldset>
                    <label class="d-flex gap-2 mt-3">
                        <input
                            id="scope-member-active"
                            type="checkbox"
                            class="form-check-input"
                        />
                        <span th:text="#{ui.foundation.active}"></span>
                    </label>
                    <p
                        id="scope-member-feedback"
                        class="feedback"
                        role="alert"
                        hidden
                    ></p>
                    <div class="dialog-actions">
                        <button
                            type="button"
                            class="button button-outline"
                            data-dialog-close
                            th:text="#{ui.catalog.cancel}"
                        ></button>
                        <button
                            type="submit"
                            class="button"
                            th:text="#{ui.catalog.save}"
                        ></button>
                    </div>
                </fieldset>
            </form>
        </dialog>

        <div
            id="scope-labels"
            hidden
            th:attr="data-title=#{ui.scope.members},data-edit=#{ui.scope.edit},data-assign=#{ui.scope.assign},data-empty=#{ui.foundation.empty},data-on=#{ui.monitoring.on},data-off=#{ui.monitoring.off},data-loading=#{ui.ops.loading},data-conflict=#{ui.accounts.conflict},data-required=#{ui.validation.selection}"
            th:fragment="scopeLabels"
        ></div>
    </body>
</html>
