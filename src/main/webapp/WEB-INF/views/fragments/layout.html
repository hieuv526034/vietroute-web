<!doctype html>
<html
    lang="vi"
    xmlns:th="http://www.thymeleaf.org"
>
    <head th:fragment="head(title)">
        <meta charset="UTF-8" />
        <meta
            name="access-no-read"
            th:content="#{ui.accessTree.noRead}"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <meta
            name="app-base"
            th:content="${basePath}"
        />
        <meta
            name="app-locale"
            th:content="${currentLocale}"
        />
        <meta
            name="app-network-error"
            th:content="#{ui.networkError}"
        />
        <meta
            name="app-request-label"
            th:content="#{ui.requestId}"
        />
        <meta
            name="app-request-help"
            th:content="#{ui.requestHelp}"
        />
        <meta
            name="app-login-action"
            th:content="#{ui.loginAgain}"
        />
        <meta
            name="app-loading"
            th:content="#{ui.loading}"
        />
        <title th:text="${title} + ' · VietRoute'">VietRoute</title>
        <link
            rel="stylesheet"
            th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"
        />
        <link
            rel="stylesheet"
            th:href="@{/assets/css/app.css}"
        />
    </head>
    <body>
        <svg
            th:fragment="icon(iconName)"
            class="ui-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <use th:href="${basePath + '/assets/icons/ui.svg#' + iconName}"></use>
        </svg>
        <th:block th:fragment="functionMenuItems(items)">
            <th:block th:each="item : ${items}">
                <a
                    th:if="${item.path != null}"
                    th:href="${basePath + item.path + '?lang=' + currentLocale}"
                    th:attr="aria-current=${item.active} ? 'page' : null"
                >
                    <svg th:replace="~{fragments/layout :: icon(${item.icon})}"></svg>
                    <span th:text="${item.name}"></span>
                </a>
                <div
                    th:if="${item.path == null and !item.children.isEmpty()}"
                    class="navigation-subgroup"
                >
                    <strong th:text="${item.name}"></strong>
                    <th:block th:insert="~{fragments/layout :: functionMenuItems(${item.children})}"></th:block>
                </div>
            </th:block>
        </th:block>
        <header
            th:fragment="header"
            class="site-header"
        >
            <nav
                class="site-nav container-xl"
                aria-label="Main navigation"
                th:attr="aria-label=#{ui.navigation}"
            >
                <a
                    class="brand"
                    th:href="@{/(lang=${currentLocale})}"
                >
                    <span
                        class="brand-symbol"
                        aria-hidden="true"
                    >
                        V
                    </span>
                    VietRoute
                    <span class="brand-dot">.</span>
                </a>
                <div class="nav-actions">
                    <details class="navigation-menu">
                        <summary
                            class="navigation-trigger"
                            aria-controls="navigation-links"
                        >
                            <svg th:replace="~{fragments/layout :: icon('menu')}"></svg>
                            <span th:text="#{ui.nav.functions}"></span>
                        </summary>
                        <div
                            id="navigation-links"
                            class="navigation-panel"
                            role="region"
                            th:attr="aria-label=#{ui.navigation}"
                        >
                            <div class="navigation-grid">
                                <section class="navigation-group">
                                    <h2 th:text="#{ui.nav.explore}"></h2>
                                    <a th:href="@{/(lang=${currentLocale})}">
                                        <svg th:replace="~{fragments/layout :: icon('home')}"></svg>
                                        <span th:text="#{ui.home}"></span>
                                    </a>
                                    <a th:href="@{/carriers(lang=${currentLocale})}">
                                        <svg th:replace="~{fragments/layout :: icon('carrier')}"></svg>
                                        <span th:text="#{ui.publicCarrier.title}"></span>
                                    </a>
                                    <a th:href="@{/journeys(lang=${currentLocale})}">
                                        <svg th:replace="~{fragments/layout :: icon('search')}"></svg>
                                        <span th:text="#{ui.journey.search}"></span>
                                    </a>
                                    <a
                                        th:if="${currentUser != null}"
                                        th:href="@{/dashboard(lang=${currentLocale})}"
                                        th:attr="aria-current=${currentPath == basePath + '/dashboard'} ? 'page' : null"
                                    >
                                        <svg th:replace="~{fragments/layout :: icon('system')}"></svg>
                                        <span th:text="#{ui.dashboard.title}"></span>
                                    </a>
                                </section>
                                <section
                                    class="navigation-group"
                                    th:each="item : ${functionNavigation}"
                                    th:classappend="${item.active} ? 'is-current'"
                                >
                                    <h2>
                                        <svg th:replace="~{fragments/layout :: icon(${item.icon})}"></svg>
                                        <span th:text="${item.name}"></span>
                                    </h2>
                                    <div class="navigation-group-links">
                                        <a
                                            th:if="${item.path != null}"
                                            th:href="${basePath + item.path + '?lang=' + currentLocale}"
                                            th:attr="aria-current=${currentPath == (basePath + item.path)} ? 'page' : null"
                                        >
                                            <svg th:replace="~{fragments/layout :: icon(${item.icon})}"></svg>
                                            <span
                                                th:text="${item.children.isEmpty()} ? ${item.name} : #{ui.workspace.overview}"
                                            ></span>
                                        </a>
                                        <th:block
                                            th:insert="~{fragments/layout :: functionMenuItems(${item.children})}"
                                        ></th:block>
                                    </div>
                                </section>
                                <section
                                    class="navigation-group"
                                    th:classappend="${navigation.docs} ? 'is-current'"
                                >
                                    <h2>
                                        <svg th:replace="~{fragments/layout :: icon('code')}"></svg>
                                        <span th:text="#{ui.docs}"></span>
                                    </h2>
                                    <div class="navigation-group-links">
                                        <a th:href="@{/docs(lang=${currentLocale})}">
                                            <svg th:replace="~{fragments/layout :: icon('code')}"></svg>
                                            <span th:text="#{ui.nav.swagger}"></span>
                                        </a>
                                        <a th:href="@{/v3/api-docs}">
                                            <svg th:replace="~{fragments/layout :: icon('code')}"></svg>
                                            <span th:text="#{ui.nav.openapi}"></span>
                                        </a>
                                    </div>
                                </section>
                            </div>
                            <div class="navigation-footer">
                                <span class="language-switch">
                                    <a
                                        th:href="${currentPath + '?lang=vi'}"
                                        th:classappend="${currentLocale == 'vi'} ? 'selected'"
                                        lang="vi"
                                    >
                                        VI
                                    </a>
                                    <a
                                        th:href="${currentPath + '?lang=en'}"
                                        th:classappend="${currentLocale == 'en'} ? 'selected'"
                                        lang="en"
                                    >
                                        EN
                                    </a>
                                </span>
                                <a
                                    class="button button-small button-outline"
                                    th:if="${currentUser == null}"
                                    th:href="@{/account-access(lang=${currentLocale},view='register')}"
                                    th:text="#{ui.accountFlow.register}"
                                ></a>
                                <a
                                    class="button button-small"
                                    th:if="${currentUser == null}"
                                    th:href="@{/login(lang=${currentLocale})}"
                                    th:text="#{ui.login}"
                                ></a>
                            </div>
                        </div>
                    </details>
                    <details
                        class="operations-menu account-menu"
                        th:if="${currentUser != null}"
                    >
                        <summary>
                            <span
                                class="avatar avatar-small"
                                data-avatar-shell
                                aria-hidden="true"
                            >
                                <img
                                    th:if="${currentUser.avatarUrl != null}"
                                    th:src="${currentUser.avatarUrl}"
                                    alt=""
                                    data-user-avatar
                                />
                                <span
                                    th:if="${currentUser.avatarUrl == null}"
                                    th:text="${#strings.toUpperCase(#strings.substring(currentUser.username,0,1))}"
                                    data-avatar-fallback
                                ></span>
                            </span>
                            <span
                                class="header-user-name"
                                data-user-name
                                th:text="${currentUser.displayName}"
                            ></span>
                        </summary>
                        <div class="operations-menu-items">
                            <a
                                th:if="${accountAllowed}"
                                th:href="@{/account(lang=${currentLocale})}"
                                th:attr="aria-current=${navigation.account} ? 'page' : null"
                            >
                                <svg th:replace="~{fragments/layout :: icon('user')}"></svg>
                                <span th:text="#{ui.account}"></span>
                            </a>
                            <button
                                class="menu-action"
                                id="logout-button"
                                type="button"
                            >
                                <svg th:replace="~{fragments/layout :: icon('logout')}"></svg>
                                <span th:text="#{ui.logout}"></span>
                            </button>
                        </div>
                    </details>
                </div>
            </nav>
        </header>
        <nav
            th:fragment="breadcrumbs"
            th:if="${breadcrumbs != null and !breadcrumbs.isEmpty()}"
            class="page-breadcrumbs container-xl"
            th:attr="aria-label=#{ui.breadcrumb}"
        >
            <ol>
                <li th:each="crumb : ${breadcrumbs}">
                    <a
                        th:href="${basePath + crumb.path + '?lang=' + currentLocale}"
                        th:attr="aria-current=${crumb.active} ? 'page' : null"
                        th:text="${crumb.name}"
                    ></a>
                </li>
            </ol>
        </nav>
        <footer
            th:fragment="footer"
            class="site-footer container-xl"
        >
            <span>VietRoute © 2026</span>
            <span th:text="#{ui.footer}">Kết nối hành trình</span>
        </footer>
        <th:block th:fragment="scripts">
            <div
                id="validation-labels"
                hidden
                th:attr="data-required=#{ui.validation.required},data-invalid=#{ui.validation.invalid},data-pattern=#{ui.validation.pattern},data-min-length=#{ui.validation.minLength},data-max-length=#{ui.validation.maxLength},data-minimum=#{ui.validation.minimum},data-maximum=#{ui.validation.maximum},data-selection=#{ui.validation.selection}"
            ></div>
            <script th:src="@{/webjars/axios/1.20.0/dist/axios.min.js}"></script>
            <script th:src="@{/assets/js/workspace.js}"></script>
            <script th:src="@{/assets/js/help.js}"></script>
            <script th:src="@{/assets/js/table.js}"></script>
            <script th:src="@{/assets/js/forms.js}"></script>
            <script th:src="@{/assets/js/request-state.js}"></script>
            <script th:src="@{/assets/js/navigation.js}"></script>
            <script th:src="@{/assets/js/app.js}"></script>
            <script th:src="@{/assets/js/presence.js}"></script>
        </th:block>
    </body>
</html>
