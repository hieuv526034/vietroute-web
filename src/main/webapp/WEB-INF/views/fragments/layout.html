<!doctype html>
<html
    lang="vi"
    xmlns:th="http://www.thymeleaf.org"
>
    <head th:fragment="head(title)">
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <meta
            name="app-base"
            th:content="${basePath}"
        />
        <meta
            name="app-locale"
            th:content="${currentLocale}"
        />
        <meta
            name="app-network-error"
            th:content="#{ui.networkError}"
        />
        <meta
            name="app-request-label"
            th:content="#{ui.requestId}"
        />
        <meta
            name="app-request-help"
            th:content="#{ui.requestHelp}"
        />
        <meta
            name="app-login-action"
            th:content="#{ui.loginAgain}"
        />
        <meta
            name="app-loading"
            th:content="#{ui.loading}"
        />
        <title th:text="${title} + ' · VietRoute'">VietRoute</title>
        <link
            rel="stylesheet"
            th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"
        />
        <link
            rel="stylesheet"
            th:href="@{/assets/css/app.css}"
        />
    </head>
    <body>
        <svg
            th:fragment="icon(iconName)"
            class="ui-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <use th:href="${basePath + '/assets/icons/ui.svg#' + iconName}"></use>
        </svg>
        <header
            th:fragment="header"
            class="site-header"
        >
            <nav
                class="site-nav container-xl"
                aria-label="Main navigation"
                th:attr="aria-label=#{ui.navigation}"
            >
                <a
                    class="brand"
                    th:href="@{/(lang=${currentLocale})}"
                >
                    <span
                        class="brand-symbol"
                        aria-hidden="true"
                    >
                        V
                    </span>
                    VietRoute
                    <span class="brand-dot">.</span>
                </a>
                <div class="nav-links">
                    <a
                        th:href="@{/(lang=${currentLocale})}"
                        th:text="#{ui.home}"
                    ></a>
                    <details
                        class="operations-menu"
                        th:if="${catalogAllowed or mediaAllowed or monitoringAllowed or configurationAllowed or jobsAllowed or journalAllowed}"
                        th:classappend="${operationsActive} ? 'is-current'"
                    >
                        <summary>
                            <svg th:replace="~{fragments/layout :: icon('system')}"></svg>
                            <span th:text="#{ui.ops.menu}"></span>
                        </summary>
                        <div class="operations-menu-items">
                            <a
                                th:if="${catalogAllowed}"
                                th:href="@{/admin(lang=${currentLocale})}"
                                th:attr="aria-current=${navigation.admin} ? 'page' : null"
                            >
                                <svg th:replace="~{fragments/layout :: icon('catalog')}"></svg>
                                <span th:text="#{ui.catalogs}"></span>
                            </a>
                            <a
                                th:if="${mediaAllowed}"
                                th:href="@{/media(lang=${currentLocale})}"
                                th:attr="aria-current=${navigation.media} ? 'page' : null"
                            >
                                <svg th:replace="~{fragments/layout :: icon('image')}"></svg>
                                <span th:text="#{ui.media}"></span>
                            </a>
                            <a
                                th:if="${journalAllowed}"
                                th:href="@{/operations/api-journal(lang=${currentLocale})}"
                                th:attr="aria-current=${navigation.journal} ? 'page' : null"
                            >
                                <svg th:replace="~{fragments/layout :: icon('activity')}"></svg>
                                <span th:text="#{ui.journal.title}"></span>
                            </a>
                            <a
                                th:if="${monitoringAllowed}"
                                th:href="@{/monitoring(lang=${currentLocale})}"
                                th:attr="aria-current=${navigation.monitoring} ? 'page' : null"
                            >
                                <svg th:replace="~{fragments/layout :: icon('activity')}"></svg>
                                <span th:text="#{ui.monitoring}"></span>
                            </a>
                            <a
                                th:if="${jobsAllowed}"
                                th:href="@{/operations/jobs(lang=${currentLocale})}"
                                th:attr="aria-current=${navigation.jobs} ? 'page' : null"
                            >
                                <svg th:replace="~{fragments/layout :: icon('clock')}"></svg>
                                <span th:text="#{ui.ops.jobs}"></span>
                            </a>
                            <a
                                th:if="${configurationAllowed}"
                                th:href="@{/operations/configuration(lang=${currentLocale})}"
                                th:attr="aria-current=${navigation.configuration} ? 'page' : null"
                            >
                                <svg th:replace="~{fragments/layout :: icon('settings')}"></svg>
                                <span th:text="#{ui.ops.configuration}"></span>
                            </a>
                        </div>
                    </details>
                    <details
                        class="operations-menu"
                        th:if="${accessAllowed}"
                        th:classappend="${navigation.access} ? 'is-current'"
                    >
                        <summary>
                            <svg th:replace="~{fragments/layout :: icon('shield')}"></svg>
                            <span th:text="#{ui.ops.access}"></span>
                        </summary>
                        <div class="operations-menu-items">
                            <a
                                th:href="@{/operations/access(lang=${currentLocale})}"
                                th:attr="aria-current=${navigation.access} ? 'page' : null"
                            >
                                <span th:text="#{ui.nav.accessWorkspace}"></span>
                            </a>
                        </div>
                    </details>
                    <details
                        class="operations-menu"
                        th:classappend="${navigation.docs} ? 'is-current'"
                    >
                        <summary>
                            <svg th:replace="~{fragments/layout :: icon('code')}"></svg>
                            <span th:text="#{ui.docs}"></span>
                        </summary>
                        <div class="operations-menu-items">
                            <a
                                th:href="@{/docs(lang=${currentLocale})}"
                                th:text="#{ui.nav.swagger}"
                            ></a>
                            <a
                                th:href="@{/v3/api-docs}"
                                th:text="#{ui.nav.openapi}"
                            ></a>
                        </div>
                    </details>
                    <span class="language-switch">
                        <a
                            th:href="${currentPath + '?lang=vi'}"
                            th:classappend="${currentLocale == 'vi'} ? 'selected'"
                            lang="vi"
                        >
                            VI
                        </a>
                        <a
                            th:href="${currentPath + '?lang=en'}"
                            th:classappend="${currentLocale == 'en'} ? 'selected'"
                            lang="en"
                        >
                            EN
                        </a>
                    </span>
                    <a
                        class="button button-small button-outline"
                        th:if="${currentUser == null}"
                        th:href="@{/account-access(lang=${currentLocale},view='register')}"
                        th:text="#{ui.accountFlow.register}"
                    ></a>
                    <a
                        class="button button-small"
                        th:if="${currentUser == null}"
                        th:href="@{/login(lang=${currentLocale})}"
                        th:text="#{ui.login}"
                    ></a>
                    <details
                        class="operations-menu account-menu"
                        th:if="${currentUser != null}"
                    >
                        <summary>
                            <span
                                class="avatar avatar-small"
                                data-avatar-shell
                            >
                                <img
                                    th:if="${currentUser.avatarUrl != null}"
                                    th:src="${currentUser.avatarUrl}"
                                    alt=""
                                    data-user-avatar
                                />
                                <span
                                    th:if="${currentUser.avatarUrl == null}"
                                    th:text="${#strings.toUpperCase(#strings.substring(currentUser.username,0,1))}"
                                    data-avatar-fallback
                                ></span>
                            </span>
                            <span
                                class="header-user-name"
                                data-user-name
                                th:text="${currentUser.displayName}"
                            ></span>
                        </summary>
                        <div class="operations-menu-items">
                            <a
                                th:if="${accountAllowed}"
                                th:href="@{/account(lang=${currentLocale})}"
                                th:attr="aria-current=${navigation.account} ? 'page' : null"
                            >
                                <svg th:replace="~{fragments/layout :: icon('user')}"></svg>
                                <span th:text="#{ui.account}"></span>
                            </a>
                            <button
                                class="menu-action"
                                id="logout-button"
                                type="button"
                            >
                                <svg th:replace="~{fragments/layout :: icon('logout')}"></svg>
                                <span th:text="#{ui.logout}"></span>
                            </button>
                        </div>
                    </details>
                </div>
            </nav>
        </header>
        <footer
            th:fragment="footer"
            class="site-footer container-xl"
        >
            <span>VietRoute © 2026</span>
            <span th:text="#{ui.footer}">Kết nối hành trình</span>
        </footer>
        <th:block th:fragment="scripts">
            <div
                id="validation-labels"
                hidden
                th:attr="data-required=#{ui.validation.required},data-invalid=#{ui.validation.invalid},data-pattern=#{ui.validation.pattern},data-min-length=#{ui.validation.minLength},data-max-length=#{ui.validation.maxLength},data-minimum=#{ui.validation.minimum},data-maximum=#{ui.validation.maximum},data-selection=#{ui.validation.selection}"
            ></div>
            <script th:src="@{/webjars/axios/1.20.0/dist/axios.min.js}"></script>
            <script th:src="@{/assets/js/workspace.js}"></script>
            <script th:src="@{/assets/js/table.js}"></script>
            <script th:src="@{/assets/js/forms.js}"></script>
            <script th:src="@{/assets/js/request-state.js}"></script>
            <script th:src="@{/assets/js/app.js}"></script>
            <script th:src="@{/assets/js/presence.js}"></script>
        </th:block>
    </body>
</html>
