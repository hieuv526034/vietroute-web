<!doctype html>
<html
    th:lang="${currentLocale}"
    xmlns:th="http://www.thymeleaf.org"
>
    <head th:replace="~{fragments/layout :: head(#{ui.account})}"></head>
    <body>
        <header th:replace="~{fragments/layout :: header}"></header>
        <nav th:replace="~{fragments/layout :: breadcrumbs}"></nav>
        <main class="container-xl workspace-page">
            <div class="page-heading">
                <p class="eyebrow">WORKSPACE / ACCOUNT</p>
                <h1 th:text="#{ui.accountTitle}"></h1>
                <p
                    class="muted"
                    th:text="#{ui.accountDescription}"
                ></p>
            </div>
            <div
                class="account-layout"
                th:classappend="${adminRecoveryVisible == true} ? 'has-recovery'"
            >
                <section
                    class="panel account-profile"
                    aria-labelledby="account-name"
                >
                    <div class="account-panel-header">
                        <span
                            class="account-panel-icon"
                            aria-hidden="true"
                        >
                            <svg th:replace="~{fragments/layout :: icon('user')}"></svg>
                        </span>
                        <div class="account-panel-copy">
                            <p
                                class="eyebrow"
                                th:text="#{ui.profile.label}"
                            ></p>
                            <h2
                                id="account-name"
                                th:text="#{ui.loading}"
                            ></h2>
                        </div>
                    </div>
                    <dl class="account-details">
                        <div>
                            <dt th:text="#{ui.username}"></dt>
                            <dd id="account-username">—</dd>
                        </div>
                        <div>
                            <dt th:text="#{ui.roles}"></dt>
                            <dd id="account-roles">—</dd>
                        </div>
                        <div>
                            <dt th:text="#{ui.accountFlow.emailStatus}"></dt>
                            <dd id="account-email">—</dd>
                        </div>
                        <div>
                            <dt th:text="#{ui.accountFlow.activate}"></dt>
                            <dd
                                id="account-email-status"
                                th:attr="data-verified=#{ui.accountFlow.verified},data-unverified=#{ui.accountFlow.unverified}"
                            >
                                —
                            </dd>
                        </div>
                        <div>
                            <dt th:text="#{ui.createdAt}"></dt>
                            <dd id="account-created">—</dd>
                        </div>
                    </dl>
                    <p
                        class="initial-password"
                        id="initial-password"
                        hidden
                        th:text="#{ui.initialPassword}"
                    ></p>
                    <div
                        id="form-feedback"
                        class="feedback"
                        role="alert"
                        th:attr="data-password-changed=#{success.passwordChanged}"
                        hidden
                    ></div>
                    <p
                        class="initial-password"
                        id="initial-email"
                        hidden
                        th:text="#{ui.initialEmail}"
                    ></p>
                    <div class="toolbar-actions account-actions">
                        <button
                            id="profile-open"
                            class="button button-outline"
                            type="button"
                            th:text="#{ui.profile.edit}"
                        ></button>
                        <button
                            id="email-open"
                            th:hidden="${adminRecoveryVisible == true}"
                            class="button button-outline"
                            type="button"
                            th:text="#{ui.accountFlow.bind}"
                        ></button>
                        <button
                            id="password-open"
                            class="button"
                            type="button"
                            th:text="#{ui.changePassword}"
                        ></button>
                    </div>
                </section>
                <section
                    class="panel account-recovery"
                    th:if="${adminRecoveryVisible == true}"
                    aria-labelledby="account-recovery-title"
                >
                    <div class="account-panel-header">
                        <span
                            class="account-panel-icon"
                            aria-hidden="true"
                        >
                            <svg th:replace="~{fragments/layout :: icon('shield')}"></svg>
                        </span>
                        <div class="account-panel-copy">
                            <p
                                class="eyebrow"
                                th:text="#{ui.admin}"
                            ></p>
                            <h2
                                id="account-recovery-title"
                                th:text="#{ui.adminRecovery.title}"
                            ></h2>
                        </div>
                    </div>
                    <p
                        class="muted"
                        th:text="#{ui.adminRecovery.description}"
                    ></p>
                    <div class="toolbar-actions">
                        <button
                            id="admin-recovery-open"
                            class="button button-outline"
                            type="button"
                            th:text="#{ui.adminRecovery.open}"
                        ></button>
                    </div>
                </section>
            </div>
            <dialog
                id="admin-recovery-dialog"
                class="workspace-dialog"
                aria-labelledby="admin-recovery-title"
                th:if="${adminRecoveryVisible == true}"
            >
                <fieldset
                    id="admin-recovery-controls"
                    class="dialog-controls"
                >
                    <div class="dialog-heading">
                        <h2
                            id="admin-recovery-title"
                            th:text="#{ui.adminRecovery.title}"
                        ></h2>
                        <button
                            class="dialog-close"
                            type="button"
                            data-dialog-close
                            th:attr="aria-label=#{ui.ops.close}"
                        >
                            ×
                        </button>
                    </div>
                    <p th:text="#{ui.adminRecovery.confirm}"></p>
                    <p
                        id="admin-recovery-feedback"
                        class="feedback"
                        role="alert"
                        hidden
                    ></p>
                    <form
                        id="admin-recovery-form"
                        novalidate
                        data-endpoint="/api/v1/auth/admin-recovery"
                        th:attr="data-success=#{ui.adminRecovery.success}"
                    >
                        <label
                            for="admin-recovery-password"
                            class="form-label"
                            th:text="#{ui.currentPassword}"
                        ></label>
                        <input
                            id="admin-recovery-password"
                            name="currentPassword"
                            type="password"
                            class="form-control"
                            required
                            maxlength="72"
                            autocomplete="current-password"
                        />
                        <div class="dialog-actions">
                            <button
                                class="button button-outline"
                                type="button"
                                data-dialog-close
                                th:text="#{ui.ops.close}"
                            ></button>
                            <button
                                type="submit"
                                class="button"
                                th:text="#{ui.adminRecovery.submit}"
                            ></button>
                        </div>
                    </form>
                    <a
                        id="admin-recovery-login"
                        class="button"
                        hidden
                        th:href="@{/login(lang=${currentLocale})}"
                        th:text="#{ui.login}"
                    ></a>
                </fieldset>
            </dialog>
            <dialog
                id="profile-dialog"
                class="workspace-dialog"
                aria-labelledby="profile-dialog-title"
            >
                <fieldset class="dialog-controls">
                    <div class="dialog-heading">
                        <h2
                            id="profile-dialog-title"
                            th:text="#{ui.profile.edit}"
                        ></h2>
                        <button
                            class="dialog-close"
                            type="button"
                            data-dialog-close
                            th:attr="aria-label=#{ui.ops.close}"
                        >
                            ×
                        </button>
                    </div>
                    <p
                        id="profile-feedback"
                        class="feedback"
                        role="alert"
                        hidden
                    ></p>
                    <form
                        id="profile-form"
                        novalidate
                    >
                        <label
                            for="profile-display-name"
                            th:text="#{ui.ops.displayName}"
                        ></label>
                        <input
                            id="profile-display-name"
                            name="displayName"
                            class="form-control"
                            required
                            maxlength="120"
                            autocomplete="name"
                        />
                        <label
                            for="profile-file"
                            class="mt-3"
                            th:text="#{ui.profile.avatar}"
                        ></label>
                        <input
                            id="profile-file"
                            name="file"
                            type="file"
                            class="form-control"
                            accept="image/jpeg,image/png"
                        />
                        <p
                            class="muted"
                            th:text="#{ui.profile.avatarNote}"
                        ></p>
                        <img
                            id="profile-preview"
                            class="avatar avatar-preview"
                            alt=""
                            hidden
                        />
                        <div class="dialog-actions">
                            <button
                                id="profile-remove-avatar"
                                class="button button-outline"
                                type="button"
                                th:text="#{ui.profile.removeAvatar}"
                            ></button>
                            <button
                                class="button button-outline"
                                type="button"
                                data-dialog-close
                                th:text="#{ui.ops.close}"
                            ></button>
                            <button
                                class="button"
                                type="submit"
                                th:text="#{ui.catalog.save}"
                            ></button>
                        </div>
                    </form>
                </fieldset>
            </dialog>
            <dialog
                id="password-dialog"
                class="workspace-dialog"
                aria-labelledby="password-dialog-title"
            >
                <fieldset
                    id="password-dialog-controls"
                    class="dialog-controls"
                >
                    <div class="dialog-heading">
                        <h2
                            id="password-dialog-title"
                            class="h4"
                            th:text="#{ui.changePassword}"
                        ></h2>
                        <button
                            class="dialog-close"
                            type="button"
                            data-dialog-close
                            th:attr="aria-label=#{ui.ops.close}"
                        >
                            <span aria-hidden="true">×</span>
                        </button>
                    </div>
                    <p
                        id="password-feedback"
                        class="feedback"
                        role="alert"
                        hidden
                    ></p>
                    <form
                        id="password-form"
                        novalidate
                    >
                        <label
                            for="current-password"
                            th:text="#{ui.currentPassword}"
                        ></label>
                        <input
                            class="form-control"
                            type="password"
                            id="current-password"
                            name="currentPassword"
                            autocomplete="current-password"
                            maxlength="72"
                            required
                        />
                        <label
                            for="new-password"
                            th:text="#{ui.newPassword}"
                        ></label>
                        <input
                            class="form-control"
                            type="password"
                            id="new-password"
                            name="newPassword"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="72"
                            aria-describedby="password-hint"
                            required
                        />
                        <p
                            class="form-help"
                            id="password-hint"
                            th:text="#{ui.passwordHint}"
                        ></p>
                        <div class="dialog-actions">
                            <button
                                class="button button-outline"
                                type="button"
                                data-dialog-close
                                th:text="#{ui.catalog.cancel}"
                            ></button>
                            <button
                                class="button"
                                type="submit"
                                th:text="#{ui.savePassword}"
                            ></button>
                        </div>
                    </form>
                </fieldset>
            </dialog>
            <dialog
                id="email-dialog"
                class="workspace-dialog"
                aria-labelledby="email-dialog-title"
            >
                <fieldset
                    class="dialog-controls"
                    id="email-controls"
                >
                    <div class="dialog-heading">
                        <h2
                            id="email-dialog-title"
                            class="h4"
                            th:text="#{ui.accountFlow.bind}"
                        ></h2>
                        <button
                            type="button"
                            class="dialog-close"
                            data-dialog-close
                            th:attr="aria-label=#{ui.ops.close}"
                        >
                            ×
                        </button>
                    </div>
                    <p th:text="#{ui.accountFlow.bindNote}"></p>
                    <p
                        id="email-feedback"
                        class="feedback"
                        role="alert"
                        hidden
                    ></p>
                    <form
                        id="email-form"
                        novalidate
                    >
                        <label
                            for="bind-email"
                            class="form-label"
                            th:text="#{ui.accountFlow.email}"
                        ></label>
                        <input
                            id="bind-email"
                            name="email"
                            type="email"
                            class="form-control mb-3"
                            required
                            maxlength="254"
                            autocomplete="email"
                        />
                        <label
                            for="bind-password"
                            class="form-label"
                            th:text="#{ui.currentPassword}"
                        ></label>
                        <input
                            id="bind-password"
                            name="currentPassword"
                            type="password"
                            class="form-control mb-3"
                            required
                            maxlength="72"
                            autocomplete="current-password"
                        />
                        <div class="dialog-actions">
                            <a
                                class="button button-outline"
                                th:href="@{/account-access(lang=${currentLocale})}"
                                th:text="#{ui.accountFlow.activate}"
                            ></a>
                            <button
                                type="submit"
                                class="button"
                                th:text="#{ui.accountFlow.submit}"
                            ></button>
                        </div>
                    </form>
                </fieldset>
            </dialog>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
        <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
        <script th:src="@{/assets/js/account-email.js}"></script>
        <script th:src="@{/assets/js/profile.js}"></script>
        <script th:src="@{/assets/js/admin-recovery.js}"></script>
    </body>
</html>
