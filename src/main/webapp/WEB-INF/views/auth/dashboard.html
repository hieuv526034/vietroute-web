<!doctype html>
<html
    xmlns:th="http://www.thymeleaf.org"
    th:lang="${currentLocale}"
>
    <head th:replace="~{fragments/layout :: head(#{ui.workspace.overview})}"></head>
    <body>
        <header th:replace="~{fragments/layout :: header}"></header>
        <nav th:replace="~{fragments/layout :: breadcrumbs}"></nav>
        <main class="container-xl workspace-page overview-page">
            <div class="page-heading dashboard-heading overview-hero">
                <p
                    class="eyebrow"
                    th:text="#{ui.overview.workspace}"
                ></p>
                <h1 th:text="#{ui.workspace.overview}"></h1>
                <p
                    class="muted"
                    th:text="#{ui.dashboard.description}"
                ></p>
            </div>
            <div class="overview-intro-actions">
                <a
                    class="button"
                    th:href="@{/dashboard(lang=${currentLocale})}"
                    th:text="#{ui.dashboard.title}"
                ></a>
                <a
                    class="button button-outline"
                    th:href="@{/journeys(lang=${currentLocale})}"
                    th:text="#{ui.journey.search}"
                ></a>
            </div>
            <div class="overview-section-title">
                <h2 th:text="#{ui.overview.modules}"></h2>
                <p
                    class="muted"
                    th:text="#{ui.overview.permissionNote}"
                ></p>
            </div>
            <div class="summary-grid overview-modules">
                <section
                    class="panel overview-module"
                    th:each="group, item : ${functionNavigation}"
                >
                    <div class="overview-module-heading">
                        <span
                            class="overview-module-number"
                            th:text="${item.count}"
                        ></span>
                        <h2 th:text="${group.name}"></h2>
                        <svg th:replace="~{fragments/layout :: icon('menu')}"></svg>
                    </div>
                    <div class="dashboard-links">
                        <a
                            th:if="${group.path != null}"
                            th:href="${basePath + group.path + '?lang=' + currentLocale}"
                            th:text="${group.name}"
                        ></a>
                        <th:block th:insert="~{fragments/layout :: functionMenuItems(${group.children})}"></th:block>
                    </div>
                </section>
            </div>
            <section
                class="panel overview-empty"
                th:if="${functionNavigation.isEmpty()}"
            >
                <h2 th:text="#{ui.overview.emptyTitle}"></h2>
                <p th:text="#{ui.overview.emptyNote}"></p>
                <a
                    th:href="@{/journeys(lang=${currentLocale})}"
                    th:text="#{ui.journey.search}"
                ></a>
            </section>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
        <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    </body>
</html>
