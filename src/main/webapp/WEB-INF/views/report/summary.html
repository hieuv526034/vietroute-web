<!doctype html>
<html
    xmlns:th="http://www.thymeleaf.org"
    th:lang="${currentLocale}"
>
    <head th:replace="~{fragments/layout :: head(#{ui.report.title})}"></head>
    <body>
        <header th:replace="~{fragments/layout :: header}"></header>
        <nav th:replace="~{fragments/layout :: breadcrumbs}"></nav>
        <main
            id="report-workspace"
            class="container-xl workspace-page"
            th:attr="data-loading=#{ui.loading},data-no-read=#{ui.accessTree.noRead},data-all=#{ui.report.all},data-inactive=#{ui.location.inactive},data-draft=#{ui.trip.DRAFT},data-open=#{ui.trip.OPEN},data-in-progress=#{ui.trip.IN_PROGRESS},data-completed=#{ui.trip.COMPLETED},data-cancelled=#{ui.trip.CANCELLED},data-pending=#{ui.booking.PENDING},data-confirmed=#{ui.booking.CONFIRMED},data-rejected=#{ui.booking.REJECTED},data-as-of=#{ui.report.asOf},data-select=#{ui.report.selectCarrier},data-empty=#{ui.foundation.empty},data-active=#{ui.location.active}"
        >
            <div class="page-heading">
                <p
                    class="eyebrow"
                    th:text="#{ui.fleet.eyebrow}"
                ></p>
                <h1 th:text="#{ui.report.title}"></h1>
                <div
                    th:replace="~{fragments/help :: guide('report-guide', #{ui.report.title}, ${ {'ui.help.report.use', 'ui.report.description', 'ui.report.seatsHelp', 'ui.report.moneyHelp'} })}"
                ></div>
            </div>
            <p
                id="report-status"
                role="status"
                aria-live="polite"
                class="catalog-status"
            ></p>
            <div
                id="report-feedback"
                role="alert"
                class="feedback"
                hidden
            ></div>
            <section class="panel">
                <fieldset
                    id="report-controls"
                    class="border-0 p-0 m-0 w-100"
                >
                    <form
                        id="report-form"
                        class="report-filter"
                    >
                        <div>
                            <label
                                for="report-from"
                                th:text="#{ui.report.from}"
                            ></label>
                            <input
                                id="report-from"
                                type="date"
                                name="fromDate"
                                class="form-control"
                                required
                                th:value="${reportFrom}"
                            />
                        </div>
                        <div>
                            <label
                                for="report-to"
                                th:text="#{ui.report.to}"
                            ></label>
                            <input
                                id="report-to"
                                type="date"
                                name="toDate"
                                class="form-control"
                                required
                                data-validation-key="dateRangeValid"
                                th:value="${reportTo}"
                            />
                        </div>
                        <div>
                            <label
                                for="report-carrier-name"
                                th:text="#{ui.report.carrier}"
                            ></label>
                            <input
                                id="report-carrier-name"
                                class="form-control"
                                readonly
                                th:value="#{ui.report.all}"
                            />
                            <input
                                id="report-carrier"
                                type="hidden"
                                name="carrierId"
                            />
                        </div>
                        <div class="toolbar-actions report-actions">
                            <button
                                id="report-carrier-open"
                                type="button"
                                class="button button-outline"
                                th:text="#{ui.report.chooseCarrier}"
                            ></button>
                            <button
                                type="submit"
                                class="button"
                                th:text="#{ui.report.apply}"
                            ></button>
                        </div>
                    </form>
                </fieldset>
            </section>
            <p
                id="report-snapshot"
                class="form-help"
                aria-live="polite"
            ></p>
            <div
                id="report-results"
                data-tabs
                hidden
            >
                <div
                    role="tablist"
                    class="workspace-tabs"
                    th:attr="aria-label=#{ui.report.title}"
                >
                    <button
                        id="report-operations-tab"
                        type="button"
                        data-tab-target="report-operations"
                        th:text="#{ui.report.operations}"
                    ></button>
                    <button
                        id="report-money-tab"
                        type="button"
                        data-tab-target="report-money"
                        th:text="#{ui.report.money}"
                    ></button>
                </div>
                <section
                    id="report-operations"
                    data-tab-panel="report-operations-tab"
                    class="panel"
                >
                    <dl class="report-metrics">
                        <div>
                            <dt th:text="#{ui.report.trips}"></dt>
                            <dd data-metric="tripCount"></dd>
                        </div>
                        <div>
                            <dt th:text="#{ui.report.bookings}"></dt>
                            <dd data-metric="bookingCount"></dd>
                        </div>
                        <div>
                            <dt th:text="#{ui.report.seats}"></dt>
                            <dd data-metric="confirmedSeats"></dd>
                        </div>
                    </dl>

                    <div class="report-status-grid">
                        <div>
                            <h2 th:text="#{ui.report.trips}"></h2>
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th th:text="#{ui.location.state}"></th>
                                            <th th:text="#{ui.report.count}"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="report-trips"></tbody>
                                </table>
                            </div>
                        </div>
                        <div>
                            <h2 th:text="#{ui.report.bookings}"></h2>
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th th:text="#{ui.location.state}"></th>
                                            <th th:text="#{ui.report.count}"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="report-bookings"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
                <section
                    id="report-money"
                    data-tab-panel="report-money-tab"
                    class="panel"
                >
                    <dl class="report-metrics">
                        <div>
                            <dt th:text="#{ui.report.value}"></dt>
                            <dd
                                data-metric="confirmedValue"
                                data-money
                            ></dd>
                        </div>
                        <div>
                            <dt th:text="#{ui.report.paid}"></dt>
                            <dd
                                data-metric="paidAmount"
                                data-money
                            ></dd>
                        </div>
                        <div>
                            <dt th:text="#{ui.report.refunded}"></dt>
                            <dd
                                data-metric="refundedAmount"
                                data-money
                            ></dd>
                        </div>
                        <div>
                            <dt th:text="#{ui.report.net}"></dt>
                            <dd
                                data-metric="netAmount"
                                data-money
                            ></dd>
                        </div>
                        <div>
                            <dt th:text="#{ui.report.outstanding}"></dt>
                            <dd
                                data-metric="refundOutstanding"
                                data-money
                            ></dd>
                        </div>
                    </dl>
                </section>
            </div>
            <dialog
                id="report-carrier-dialog"
                class="workspace-dialog workspace-dialog-wide"
                aria-labelledby="report-carrier-title"
            >
                <div class="dialog-heading">
                    <h2
                        id="report-carrier-title"
                        th:text="#{ui.report.chooseCarrier}"
                    ></h2>
                    <button
                        type="button"
                        class="dialog-close"
                        data-dialog-close
                        th:attr="aria-label=#{ui.ops.close}"
                    >
                        ×
                    </button>
                </div>
                <p
                    id="report-picker-feedback"
                    class="feedback"
                    role="alert"
                    hidden
                ></p>
                <fieldset
                    id="report-picker-controls"
                    class="dialog-controls"
                >
                    <div class="report-picker-content">
                        <form
                            id="report-carrier-search"
                            class="table-filter record-search"
                        >
                            <label
                                for="report-query"
                                th:text="#{ui.report.searchCarriers}"
                            ></label>
                            <input
                                id="report-query"
                                class="form-control"
                                type="search"
                                maxlength="160"
                            />
                            <div class="toolbar-actions">
                                <button
                                    type="submit"
                                    class="button button-outline"
                                    th:text="#{ui.search}"
                                ></button>
                                <button
                                    id="report-carrier-all"
                                    type="button"
                                    class="button button-outline"
                                    th:text="#{ui.report.all}"
                                ></button>
                            </div>
                        </form>
                        <div
                            class="table-responsive"
                            tabindex="0"
                            role="region"
                            th:attr="aria-label=#{ui.table.scroll}"
                        >
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th th:text="#{ui.code}"></th>
                                        <th th:text="#{ui.name}"></th>
                                        <th th:text="#{ui.location.state}"></th>
                                        <th
                                            class="table-actions"
                                            th:text="#{ui.ops.actions}"
                                        ></th>
                                    </tr>
                                </thead>
                                <tbody id="report-carriers-body"></tbody>
                            </table>
                        </div>
                        <nav th:replace="~{fragments/pagination :: pager('report-carriers', 10)}"></nav>
                        <div class="dialog-actions">
                            <button
                                type="button"
                                class="button button-outline"
                                data-dialog-close
                                th:text="#{ui.ops.close}"
                            ></button>
                        </div>
                    </div>
                </fieldset>
            </dialog>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
        <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
        <script th:src="@{/assets/js/reports.js}"></script>
    </body>
</html>
