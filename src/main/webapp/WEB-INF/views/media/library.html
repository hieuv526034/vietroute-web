<!doctype html>
<html
    th:lang="${currentLocale}"
    xmlns:th="http://www.thymeleaf.org"
>
    <head th:replace="~{fragments/layout :: head(#{ui.media})}"></head>
    <body>
        <header th:replace="~{fragments/layout :: header}"></header>
        <nav th:replace="~{fragments/layout :: breadcrumbs}"></nav>
        <main
            class="container-xl workspace-page"
            id="media-library"
            th:data-enabled="${mediaEnabled}"
            th:attr="data-edit=#{ui.foundation.mediaEdit},data-empty=#{ui.mediaEmpty},data-view=#{ui.mediaView},data-delete=#{ui.mediaDelete},data-confirm=#{ui.mediaConfirm},data-pending=#{ui.mediaPending},data-ready=#{ui.mediaReady},data-deleting=#{ui.mediaDeleting},data-deleted=#{ui.mediaDeleted}"
        >
            <div class="page-heading">
                <p class="eyebrow">VIETROUTE / MEDIA</p>
                <h1 th:text="#{ui.media}"></h1>
                <p
                    class="muted"
                    th:text="#{ui.mediaDescription}"
                ></p>
            </div>
            <section class="panel mb-4">
                <p
                    th:unless="${mediaEnabled}"
                    class="notice mb-3"
                    role="status"
                    th:text="#{ui.mediaDisabledNote}"
                ></p>
                <div class="toolbar-actions">
                    <button
                        id="media-open"
                        class="button"
                        type="button"
                        disabled
                        th:text="#{ui.mediaUpload}"
                    ></button>
                    <button
                        id="media-refresh"
                        class="button button-outline"
                        type="button"
                        th:text="#{ui.mediaRefresh}"
                    ></button>
                </div>

                <p
                    id="form-feedback"
                    class="feedback"
                    role="status"
                    hidden
                ></p>
            </section>
            <section
                class="media-gallery"
                id="media-gallery"
                aria-live="polite"
            ></section>
            <div th:replace="~{fragments/pagination :: pager('media', 12)}"></div>
            <dialog
                id="media-dialog"
                class="workspace-dialog"
                aria-labelledby="media-dialog-title"
            >
                <fieldset
                    id="media-dialog-controls"
                    class="dialog-controls"
                >
                    <div class="dialog-heading">
                        <h2
                            id="media-dialog-title"
                            class="h4"
                            th:text="#{ui.mediaUpload}"
                        ></h2>
                        <button
                            class="dialog-close"
                            type="button"
                            data-dialog-close
                            th:attr="aria-label=#{ui.ops.close}"
                        >
                            <span aria-hidden="true">×</span>
                        </button>
                    </div>
                    <p
                        class="form-help"
                        th:text="#{ui.mediaDescription}"
                    ></p>
                    <p
                        id="media-upload-feedback"
                        class="feedback"
                        role="alert"
                        hidden
                    ></p>
                    <form
                        id="media-upload-form"
                        enctype="multipart/form-data"
                    >
                        <label
                            class="form-label"
                            for="media-file"
                            th:text="#{ui.mediaChoose}"
                        ></label>
                        <input
                            id="media-file"
                            name="file"
                            type="file"
                            class="form-control mb-3"
                            accept="image/jpeg,image/png"
                            required
                            th:disabled="${!mediaEnabled}"
                        />
                        <div class="dialog-actions">
                            <button
                                class="button button-outline"
                                type="button"
                                data-dialog-close
                                th:text="#{ui.catalog.cancel}"
                            ></button>
                            <button
                                id="media-upload"
                                class="button"
                                type="submit"
                                disabled
                                th:text="#{ui.mediaUpload}"
                            ></button>
                        </div>
                    </form>
                </fieldset>
            </dialog>
            <dialog
                id="media-edit-dialog"
                class="workspace-dialog"
                aria-labelledby="media-edit-dialog-title"
            >
                <fieldset class="dialog-controls">
                    <div class="dialog-heading">
                        <h2
                            id="media-edit-dialog-title"
                            class="h4"
                            th:text="#{ui.foundation.mediaEdit}"
                        ></h2>
                        <button
                            type="button"
                            class="dialog-close"
                            data-dialog-close
                            th:attr="aria-label=#{ui.ops.close}"
                        >
                            ×
                        </button>
                    </div>
                    <p
                        id="media-edit-dialog-feedback"
                        class="feedback"
                        role="alert"
                        hidden
                    ></p>
                    <form id="media-edit-form">
                        <div class="mb-3">
                            <label
                                class="form-label"
                                for="media-title"
                                th:text="#{ui.foundation.mediaTitle}"
                            ></label>
                            <input
                                id="media-title"
                                name="title"
                                class="form-control"
                                required
                                maxlength="160"
                            />
                        </div>
                        <div class="mb-3">
                            <label
                                class="form-label"
                                for="media-alt"
                                th:text="#{ui.foundation.mediaAlt}"
                            ></label>
                            <input
                                id="media-alt"
                                name="altText"
                                class="form-control"
                                maxlength="300"
                            />
                        </div>
                        <div class="dialog-actions">
                            <button
                                type="button"
                                class="button button-outline"
                                data-dialog-close
                                th:text="#{ui.foundation.cancel}"
                            ></button>
                            <button
                                type="submit"
                                class="button"
                                th:text="#{ui.catalog.save}"
                            ></button>
                        </div>
                    </form>
                </fieldset>
            </dialog>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
        <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
        <script th:src="@{/assets/js/media.js}"></script>
    </body>
</html>
