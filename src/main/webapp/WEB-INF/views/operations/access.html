<!doctype html>
<html
    lang="vi"
    xmlns:th="http://www.thymeleaf.org"
    th:lang="${currentLocale}"
>
    <head th:replace="~{fragments/layout :: head(#{ui.ops.access})}"></head>
    <body>
        <header th:replace="~{fragments/layout :: header}"></header>
        <main
            class="container-xl py-5 operations-page"
            data-operations="access"
        >
            <div class="d-flex flex-wrap justify-content-between gap-3 align-items-center mb-3">
                <h1 th:text="#{ui.ops.access}"></h1>
                <button
                    class="button button-outline"
                    type="button"
                    id="ops-refresh"
                    th:text="#{ui.ops.refresh}"
                ></button>
            </div>
            <p
                class="text-secondary"
                th:text="#{ui.ops.accessNote}"
            ></p>
            <p
                id="form-feedback"
                class="feedback"
                role="alert"
                hidden
            ></p>
            <p
                id="ops-status"
                role="status"
                aria-live="polite"
            ></p>
            <fieldset
                id="ops-controls"
                data-tabs
                class="border-0 p-0 m-0 w-100"
            >
                <div
                    class="workspace-tabs"
                    role="tablist"
                    th:attr="aria-label=#{ui.ops.access}"
                >
                    <button
                        id="permissions-tab"
                        type="button"
                        data-tab-target="access-roles-section"
                        th:text="#{ui.ops.rolePermissions}"
                    ></button>
                    <button
                        id="users-tab"
                        type="button"
                        data-tab-target="access-users-section"
                        hidden
                        th:text="#{ui.ops.userRoles}"
                    ></button>
                    <button
                        id="registry-tab"
                        type="button"
                        data-tab-target="access-registry-section"
                        th:if="${accessAllowed}"
                        th:text="#{ui.foundation.registry}"
                    ></button>
                    <button
                        id="policies-tab"
                        type="button"
                        data-tab-target="access-policies-section"
                        th:if="${accessAllowed}"
                        th:text="#{ui.foundation.policies}"
                    ></button>
                    <button
                        id="history-tab"
                        type="button"
                        data-tab-target="access-history-section"
                        th:if="${adminUser}"
                        th:text="#{ui.accessHistory.title}"
                    ></button>
                    <button
                        id="resources-tab"
                        type="button"
                        data-tab-target="access-resources-section"
                        th:if="${accessAllowed}"
                        th:text="#{ui.accessResources.title}"
                    ></button>
                </div>
                <section
                    id="access-roles-section"
                    class="card p-4"
                    aria-labelledby="role-title"
                >
                    <h2
                        id="role-title"
                        class="h4"
                        th:text="#{ui.ops.rolePermissions}"
                    ></h2>
                    <div class="toolbar-actions mb-3">
                        <a
                            class="button button-outline"
                            th:if="${adminUser}"
                            th:href="@{/operations/accounts(lang=${currentLocale})}"
                            th:text="#{ui.accounts.title}"
                        ></a>
                        <button
                            id="access-new-role"
                            class="button"
                            type="button"
                            hidden
                            th:text="#{ui.foundation.newRole}"
                        ></button>
                    </div>
                    <label
                        for="access-role"
                        class="form-label"
                        th:text="#{ui.ops.role}"
                    ></label>
                    <label
                        for="access-role-search"
                        class="form-label"
                        th:text="#{ui.accessRoles.search}"
                    ></label>
                    <input
                        id="access-role-search"
                        type="search"
                        class="form-control mb-2"
                        maxlength="160"
                        autocomplete="off"
                    />
                    <p
                        id="access-role-count"
                        role="status"
                        class="muted"
                    ></p>
                    <select
                        id="access-role"
                        class="form-select mb-3"
                        disabled
                    ></select>
                    <p
                        id="role-note"
                        class="text-secondary"
                        role="status"
                    ></p>
                    <p>
                        <span th:text="#{ui.ops.version}"></span>
                        :
                        <strong id="role-version">—</strong>
                    </p>
                    <div
                        id="role-permission-summary"
                        class="permission-summary"
                    ></div>
                    <div class="toolbar-actions">
                        <button
                            id="permissions-edit"
                            class="button"
                            type="button"
                            disabled
                            th:text="#{ui.workspace.editPermissions}"
                        ></button>
                    </div>
                </section>
                <section
                    class="card p-4"
                    id="access-users-section"
                    aria-labelledby="user-role-title"
                    hidden
                >
                    <h2
                        id="user-role-title"
                        class="h4"
                        th:text="#{ui.ops.userRoles}"
                    ></h2>
                    <p
                        th:text="#{ui.ops.userRolesNote}"
                        class="text-secondary"
                    ></p>
                    <form
                        id="users-search"
                        class="table-filter mb-3"
                    >
                        <div>
                            <label
                                for="user-prefix"
                                class="form-label"
                                th:text="#{ui.ops.usernamePrefix}"
                            ></label>
                            <input
                                id="user-prefix"
                                name="username"
                                class="form-control"
                                maxlength="32"
                                pattern="[A-Za-z0-9]{0,32}"
                                autocomplete="off"
                            />
                        </div>
                        <button
                            type="submit"
                            class="button button-outline"
                            th:text="#{ui.ops.filter}"
                        ></button>
                    </form>
                    <div
                        class="table-responsive"
                        tabindex="0"
                        role="region"
                        th:attr="aria-label=#{ui.table.scroll}"
                    >
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th th:text="#{ui.ops.username}"></th>
                                    <th th:text="#{ui.ops.displayName}"></th>
                                    <th th:text="#{ui.ops.role}"></th>
                                    <th th:text="#{ui.ops.status}"></th>
                                    <th
                                        class="table-actions"
                                        th:text="#{ui.ops.actions}"
                                    ></th>
                                </tr>
                            </thead>
                            <tbody id="users-body"></tbody>
                        </table>
                    </div>
                    <div th:replace="~{fragments/pagination :: pager('users', 20)}"></div>
                </section>
                <section
                    id="access-resources-section"
                    class="card p-4"
                    hidden
                    th:if="${accessAllowed}"
                    aria-labelledby="resources-title"
                >
                    <h2
                        id="resources-title"
                        class="h4"
                        th:text="#{ui.accessResources.title}"
                    ></h2>
                    <p
                        class="text-secondary"
                        th:text="#{ui.accessResources.note}"
                    ></p>
                    <form
                        id="resources-filter"
                        class="table-filter mb-3 resources-filter"
                    >
                        <div class="filter-field">
                            <label
                                for="resources-kind"
                                th:text="#{ui.accessResources.kind}"
                            ></label>
                            <select
                                id="resources-kind"
                                class="form-select"
                            >
                                <option
                                    value=""
                                    th:text="#{ui.ops.all}"
                                ></option>
                                <option
                                    value="MENU"
                                    th:text="#{ui.accessResources.menu}"
                                ></option>
                                <option
                                    value="ENDPOINT"
                                    th:text="#{ui.accessResources.api}"
                                ></option>
                            </select>
                        </div>
                        <div class="filter-field">
                            <label
                                for="resources-query"
                                th:text="#{ui.accessResources.search}"
                            ></label>
                            <input
                                id="resources-query"
                                class="form-control"
                                type="search"
                                maxlength="160"
                                th:placeholder="#{ui.accessResources.searchHint}"
                            />
                        </div>
                        <div class="toolbar-actions">
                            <button
                                id="resources-search"
                                type="submit"
                                class="button"
                                th:text="#{ui.ops.filter}"
                            ></button>
                            <button
                                id="resources-refresh"
                                type="button"
                                class="button button-outline"
                                th:text="#{ui.foundation.refresh}"
                            ></button>
                        </div>
                    </form>
                    <p
                        id="resources-status"
                        role="status"
                    ></p>
                    <div
                        class="table-responsive"
                        tabindex="0"
                        role="region"
                        th:attr="aria-label=#{ui.table.scroll}"
                    >
                        <table class="table align-middle access-resources-table">
                            <thead>
                                <tr>
                                    <th th:text="#{ui.accessResources.kind}"></th>
                                    <th th:text="#{ui.accessResources.target}"></th>
                                    <th th:text="#{ui.accessResources.description}"></th>
                                    <th th:text="#{ui.accessResources.access}"></th>
                                    <th th:text="#{ui.accessResources.lastSeen}"></th>
                                </tr>
                            </thead>
                            <tbody id="resources-body"></tbody>
                        </table>
                    </div>
                    <nav th:replace="~{fragments/pagination :: pager('resources', 20)}"></nav>
                </section>
                <section
                    id="access-registry-section"
                    class="card p-4"
                    th:if="${accessAllowed}"
                >
                    <h2
                        class="h4"
                        th:text="#{ui.foundation.registry}"
                    ></h2>
                    <p th:text="#{ui.foundation.registryNote}"></p>
                    <form
                        id="registry-filter"
                        class="table-filter mb-3"
                    >
                        <div>
                            <label
                                for="registry-kind"
                                th:text="#{ui.foundation.kind}"
                            ></label>
                            <select
                                id="registry-kind"
                                class="form-select"
                            >
                                <option
                                    value="roles"
                                    th:text="#{ui.foundation.roles}"
                                ></option>
                                <option
                                    value="permissions"
                                    th:text="#{ui.foundation.permissions}"
                                ></option>
                            </select>
                        </div>
                        <div>
                            <label
                                for="registry-query"
                                th:text="#{ui.accessRoles.registrySearch}"
                            ></label>
                            <input
                                id="registry-query"
                                class="form-control"
                                type="search"
                                maxlength="160"
                            />
                        </div>
                        <div>
                            <label
                                for="registry-active"
                                th:text="#{ui.foundation.active}"
                            ></label>
                            <select
                                id="registry-active"
                                class="form-select"
                            >
                                <option
                                    value=""
                                    th:text="#{ui.accessResources.allKinds}"
                                ></option>
                                <option
                                    value="true"
                                    th:text="#{ui.monitoring.on}"
                                ></option>
                                <option
                                    value="false"
                                    th:text="#{ui.monitoring.off}"
                                ></option>
                            </select>
                        </div>
                        <button
                            id="registry-search"
                            type="submit"
                            class="button button-outline"
                            th:text="#{ui.ops.filter}"
                        ></button>
                        <button
                            id="registry-refresh"
                            type="button"
                            class="button button-outline"
                            th:text="#{ui.foundation.refresh}"
                        ></button>
                        <button
                            id="registry-create"
                            type="button"
                            class="button button-outline"
                            th:text="#{ui.foundation.new}"
                        ></button>
                    </form>
                    <p
                        id="registry-capacity"
                        class="muted"
                        role="status"
                    ></p>
                    <p
                        id="registry-status"
                        role="status"
                    ></p>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th th:text="#{ui.foundation.code}"></th>
                                    <th th:text="#{ui.foundation.nameVi}"></th>
                                    <th th:text="#{ui.foundation.nameEn}"></th>
                                    <th th:text="#{ui.foundation.active}"></th>
                                    <th th:text="#{ui.foundation.version}"></th>
                                    <th
                                        class="table-actions"
                                        th:text="#{ui.foundation.actions}"
                                    ></th>
                                </tr>
                            </thead>
                            <tbody id="registry-body"></tbody>
                        </table>
                    </div>
                    <nav th:replace="~{fragments/pagination :: pager('registry', 20)}"></nav>
                </section>
                <section
                    id="access-policies-section"
                    class="card p-4"
                    th:if="${accessAllowed}"
                >
                    <h2
                        class="h4"
                        th:text="#{ui.foundation.policies}"
                    ></h2>
                    <p th:text="#{ui.foundation.policyNote}"></p>
                    <div class="toolbar-actions mb-3">
                        <button
                            id="policies-refresh"
                            type="button"
                            class="button button-outline"
                            th:text="#{ui.foundation.refresh}"
                        ></button>
                        <button
                            id="policies-create"
                            type="button"
                            class="button button-outline"
                            th:text="#{ui.foundation.new}"
                        ></button>
                    </div>
                    <p
                        id="policies-status"
                        role="status"
                    ></p>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th th:text="#{ui.foundation.kind}"></th>
                                    <th th:text="#{ui.foundation.target}"></th>
                                    <th th:text="#{ui.foundation.nameVi}"></th>
                                    <th th:text="#{ui.foundation.active}"></th>
                                    <th
                                        class="table-actions"
                                        th:text="#{ui.foundation.actions}"
                                    ></th>
                                </tr>
                            </thead>
                            <tbody id="policies-body"></tbody>
                        </table>
                    </div>
                </section>
                <section
                    id="access-history-section"
                    class="card p-4"
                    aria-labelledby="history-title"
                    th:if="${adminUser}"
                    hidden
                >
                    <h2
                        id="history-title"
                        class="h4"
                        th:text="#{ui.accessHistory.title}"
                    ></h2>
                    <p
                        class="muted"
                        th:text="#{ui.accessHistory.note}"
                    ></p>
                    <p
                        id="history-feedback"
                        class="feedback"
                        role="alert"
                        hidden
                    ></p>
                    <fieldset
                        id="history-controls"
                        class="border-0 p-0 m-0 w-100"
                    >
                        <form
                            id="history-filter"
                            class="table-filter mb-3"
                        >
                            <div class="filter-field">
                                <label
                                    for="history-event"
                                    th:text="#{ui.accessHistory.event}"
                                ></label>
                                <select
                                    id="history-event"
                                    class="form-select"
                                >
                                    <option
                                        value=""
                                        th:text="#{ui.accounts.all}"
                                    ></option>
                                    <option
                                        th:each="item : ${accessHistoryEvents}"
                                        th:value="${item.name()}"
                                        th:text="${#messages.msg(item.messageKey())}"
                                    ></option>
                                </select>
                            </div>
                            <div class="filter-field">
                                <label
                                    for="history-target"
                                    th:text="#{ui.accessHistory.target}"
                                ></label>
                                <input
                                    id="history-target"
                                    class="form-control"
                                    maxlength="120"
                                />
                            </div>
                            <div class="filter-field">
                                <label
                                    for="history-actor"
                                    th:text="#{ui.accessHistory.actorId}"
                                ></label>
                                <input
                                    id="history-actor"
                                    class="form-control"
                                    type="number"
                                    min="0"
                                    step="1"
                                />
                            </div>
                            <div class="toolbar-actions">
                                <button
                                    type="submit"
                                    class="button"
                                    th:text="#{ui.ops.filter}"
                                ></button>
                                <button
                                    id="history-refresh"
                                    type="button"
                                    class="button button-outline"
                                    th:text="#{ui.ops.refresh}"
                                ></button>
                            </div>
                        </form>
                        <p
                            id="history-status"
                            role="status"
                            aria-live="polite"
                        ></p>
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th th:text="#{ui.accessHistory.time}"></th>
                                        <th th:text="#{ui.accessHistory.event}"></th>
                                        <th th:text="#{ui.accessHistory.target}"></th>
                                        <th th:text="#{ui.accessHistory.actor}"></th>
                                        <th
                                            class="table-actions"
                                            th:text="#{ui.ops.actions}"
                                        ></th>
                                    </tr>
                                </thead>
                                <tbody id="history-body"></tbody>
                            </table>
                        </div>
                        <nav th:replace="~{fragments/pagination :: pager('history', 20)}"></nav>
                    </fieldset>
                </section>
            </fieldset>
            <dialog
                id="permissions-dialog"
                class="workspace-dialog workspace-dialog-wide"
                aria-labelledby="permissions-dialog-title"
            >
                <fieldset
                    class="dialog-controls"
                    data-modal-controls
                >
                    <div class="dialog-heading">
                        <h2
                            id="permissions-dialog-title"
                            class="h4"
                            th:text="#{ui.workspace.editPermissions}"
                        ></h2>
                        <button
                            class="dialog-close"
                            type="button"
                            data-dialog-close
                            th:attr="aria-label=#{ui.ops.close}"
                        >
                            <span aria-hidden="true">×</span>
                        </button>
                    </div>
                    <p
                        id="permissions-target"
                        class="muted"
                    ></p>
                    <p
                        id="permissions-feedback"
                        class="feedback"
                        role="alert"
                        hidden
                    ></p>
                    <form id="permissions-form">
                        <div
                            id="permissions-body"
                            class="access-tree"
                        ></div>
                        <div class="dialog-actions">
                            <button
                                class="button button-outline"
                                type="button"
                                data-dialog-close
                                th:text="#{ui.catalog.cancel}"
                            ></button>
                            <button
                                id="permissions-save"
                                class="button"
                                type="submit"
                                disabled
                                th:text="#{ui.ops.savePermissions}"
                            ></button>
                        </div>
                    </form>
                </fieldset>
            </dialog>
            <dialog
                id="user-roles-dialog"
                class="workspace-dialog"
                aria-labelledby="selected-user"
            >
                <fieldset
                    class="dialog-controls"
                    data-modal-controls
                >
                    <div class="dialog-heading">
                        <span
                            class="eyebrow"
                            th:text="#{ui.ops.userRoles}"
                        ></span>
                        <button
                            class="dialog-close"
                            type="button"
                            data-dialog-close
                            th:attr="aria-label=#{ui.ops.close}"
                        >
                            <span aria-hidden="true">×</span>
                        </button>
                    </div>
                    <p
                        id="user-roles-feedback"
                        class="feedback"
                        role="alert"
                        hidden
                    ></p>
                    <form
                        id="user-roles-form"
                        class="border rounded p-3"
                    >
                        <h3
                            class="h5"
                            id="selected-user"
                        ></h3>
                        <p>
                            <span th:text="#{ui.ops.version}"></span>
                            :
                            <strong id="user-version"></strong>
                        </p>
                        <label
                            for="user-role-search"
                            class="form-label"
                            th:text="#{ui.accessRoles.search}"
                        ></label>
                        <input
                            id="user-role-search"
                            type="search"
                            class="form-control"
                            maxlength="160"
                            autocomplete="off"
                        />
                        <p
                            id="user-role-count"
                            role="status"
                            class="muted"
                        ></p>
                        <fieldset
                            id="user-role-options"
                            data-required-selection
                            data-validation-key="roles"
                        >
                            <legend
                                class="h6"
                                th:text="#{ui.ops.role}"
                            ></legend>
                        </fieldset>
                        <div class="dialog-actions">
                            <button
                                class="button button-outline"
                                type="button"
                                data-dialog-close
                                th:text="#{ui.catalog.cancel}"
                            ></button>
                            <button
                                id="user-roles-save"
                                class="button"
                                type="submit"
                                disabled
                                th:text="#{ui.ops.saveRoles}"
                            ></button>
                        </div>
                    </form>
                </fieldset>
            </dialog>
            <div
                id="ops-labels"
                hidden
                th:attr="data-empty=#{ui.ops.empty},data-loading=#{ui.ops.loading},data-saved=#{ui.ops.saved},data-confirm-retry=#{ui.ops.confirmRetry},data-confirm-permissions=#{ui.ops.confirmPermissions},data-confirm-roles=#{ui.ops.confirmRoles},data-details=#{ui.ops.details},data-retry=#{ui.ops.retry},data-select=#{ui.ops.select},data-on=#{ui.monitoring.on},data-off=#{ui.monitoring.off},data-page=#{ui.ops.page},data-fixed=#{ui.ops.fixed},data-readonly=#{ui.ops.readonly},data-restricted=#{ui.ops.restricted},data-self=#{ui.ops.self},data-conflict=#{ui.ops.conflict}"
            ></div>
            <th:block th:if="${accessAllowed}">
                <dialog
                    id="registry-dialog"
                    class="workspace-dialog"
                    aria-labelledby="registry-dialog-title"
                >
                    <fieldset class="dialog-controls">
                        <div class="dialog-heading">
                            <h2
                                id="registry-dialog-title"
                                class="h4"
                                th:text="#{ui.foundation.registry}"
                            ></h2>
                            <button
                                type="button"
                                class="dialog-close"
                                data-dialog-close
                                th:attr="aria-label=#{ui.ops.close}"
                            >
                                ×
                            </button>
                        </div>
                        <p
                            id="registry-dialog-feedback"
                            class="feedback"
                            role="alert"
                            hidden
                        ></p>
                        <form id="registry-form">
                            <div class="mb-3">
                                <label
                                    class="form-label"
                                    for="registry-code"
                                    th:text="#{ui.foundation.code}"
                                ></label>
                                <input
                                    id="registry-code"
                                    name="code"
                                    class="form-control"
                                    required
                                    maxlength="40"
                                    pattern="[A-Z][A-Z0-9_]+"
                                />
                            </div>
                            <div class="mb-3">
                                <label
                                    class="form-label"
                                    for="registry-name-vi"
                                    th:text="#{ui.foundation.nameVi}"
                                ></label>
                                <input
                                    id="registry-name-vi"
                                    name="nameVi"
                                    class="form-control"
                                    required
                                    maxlength="120"
                                />
                            </div>
                            <div class="mb-3">
                                <label
                                    class="form-label"
                                    for="registry-name-en"
                                    th:text="#{ui.foundation.nameEn}"
                                ></label>
                                <input
                                    id="registry-name-en"
                                    name="nameEn"
                                    class="form-control"
                                    required
                                    maxlength="120"
                                />
                            </div>
                            <label class="form-check mb-3">
                                <input
                                    name="active"
                                    type="checkbox"
                                    class="form-check-input"
                                />
                                <span th:text="#{ui.foundation.active}"></span>
                            </label>
                            <div class="dialog-actions">
                                <button
                                    type="button"
                                    class="button button-outline"
                                    data-dialog-close
                                    th:text="#{ui.foundation.cancel}"
                                ></button>
                                <button
                                    type="submit"
                                    class="button"
                                    th:text="#{ui.foundation.save}"
                                ></button>
                            </div>
                        </form>
                    </fieldset>
                </dialog>
                <dialog
                    id="policy-dialog"
                    class="workspace-dialog"
                    aria-labelledby="policy-dialog-title"
                >
                    <fieldset class="dialog-controls">
                        <div class="dialog-heading">
                            <h2
                                id="policy-dialog-title"
                                class="h4"
                                th:text="#{ui.foundation.policies}"
                            ></h2>
                            <button
                                type="button"
                                class="dialog-close"
                                data-dialog-close
                                th:attr="aria-label=#{ui.ops.close}"
                            >
                                ×
                            </button>
                        </div>
                        <p
                            id="policy-dialog-feedback"
                            class="feedback"
                            role="alert"
                            hidden
                        ></p>
                        <form id="policy-form">
                            <label
                                for="policy-target"
                                class="form-label"
                                th:text="#{ui.foundation.target}"
                            ></label>
                            <select
                                id="policy-target"
                                name="target"
                                class="form-select mb-3"
                                required
                            ></select>
                            <div class="mb-3">
                                <label
                                    class="form-label"
                                    for="policy-name-vi"
                                    th:text="#{ui.foundation.nameVi}"
                                ></label>
                                <input
                                    id="policy-name-vi"
                                    name="nameVi"
                                    class="form-control"
                                    required
                                    maxlength="160"
                                />
                            </div>
                            <div class="mb-3">
                                <label
                                    class="form-label"
                                    for="policy-name-en"
                                    th:text="#{ui.foundation.nameEn}"
                                ></label>
                                <input
                                    id="policy-name-en"
                                    name="nameEn"
                                    class="form-control"
                                    required
                                    maxlength="160"
                                />
                            </div>
                            <label class="form-check mb-3">
                                <input
                                    name="enabled"
                                    type="checkbox"
                                    class="form-check-input"
                                />
                                <span th:text="#{ui.foundation.enabled}"></span>
                            </label>
                            <label
                                for="policy-permissions"
                                class="form-label"
                                th:text="#{ui.foundation.allPermissions}"
                            ></label>
                            <select
                                id="policy-permissions"
                                name="permissions"
                                multiple
                                size="7"
                                class="form-select mb-3"
                            ></select>
                            <label
                                for="policy-roles"
                                class="form-label"
                                th:text="#{ui.foundation.anyRoles}"
                            ></label>
                            <select
                                id="policy-roles"
                                name="roles"
                                multiple
                                size="5"
                                class="form-select mb-3"
                            ></select>
                            <div class="dialog-actions">
                                <button
                                    id="policy-delete"
                                    type="button"
                                    class="button button-outline"
                                    th:text="#{ui.foundation.delete}"
                                ></button>
                                <button
                                    type="button"
                                    class="button button-outline"
                                    data-dialog-close
                                    th:text="#{ui.foundation.cancel}"
                                ></button>
                                <button
                                    type="submit"
                                    class="button"
                                    th:text="#{ui.foundation.save}"
                                ></button>
                            </div>
                        </form>
                    </fieldset>
                </dialog>
            </th:block>
            <div
                id="access-tree-labels"
                hidden

            ></div>
            <div
                id="foundation-labels"
                th:data-capacity="#{ui.accessRoles.capacity}"
                hidden
                th:attr="data-delete-role=#{ui.foundation.deleteRole},data-confirm-role=#{ui.foundation.confirmRole},data-empty=#{ui.foundation.empty},data-edit=#{ui.foundation.edit},data-confirm=#{ui.foundation.confirm},data-on=#{ui.monitoring.on},data-off=#{ui.monitoring.off},data-public=#{ui.accessResources.public},data-protected=#{ui.accessResources.protected},data-reserved=#{ui.accessResources.reserved},data-menu=#{ui.accessResources.menu},data-api=#{ui.accessResources.api}"
            ></div>
            <dialog
                id="history-dialog"
                class="workspace-dialog workspace-dialog-wide"
                th:if="${adminUser}"
                aria-labelledby="history-detail-title"
            >
                <div class="dialog-heading">
                    <h2
                        id="history-detail-title"
                        class="h4"
                        th:text="#{ui.accessHistory.detail}"
                    ></h2>
                    <button
                        type="button"
                        class="dialog-close"
                        data-dialog-close
                        th:attr="aria-label=#{ui.ops.close}"
                    >
                        ×
                    </button>
                </div>
                <dl
                    id="history-meta"
                    class="operations-details"
                ></dl>
                <p
                    id="history-delta-note"
                    class="muted"
                    th:text="#{ui.accessHistory.deltaNote}"
                ></p>
                <div class="access-history-states">
                    <section class="access-history-state">
                        <h3
                            class="h6"
                            th:text="#{ui.accessHistory.before}"
                        ></h3>
                        <dl
                            id="history-before"
                            class="operations-details"
                        ></dl>
                    </section>
                    <section class="access-history-state">
                        <h3
                            class="h6"
                            th:text="#{ui.accessHistory.after}"
                        ></h3>
                        <dl
                            id="history-after"
                            class="operations-details"
                        ></dl>
                    </section>
                </div>
                <div class="dialog-actions">
                    <button
                        type="button"
                        class="button button-outline"
                        data-dialog-close
                        th:text="#{ui.ops.close}"
                    ></button>
                </div>
            </dialog>
            <div
                id="history-labels"
                hidden
                th:if="${adminUser}"
                th:attr="data-empty=#{ui.accessTree.empty},data-loading=#{ui.ops.loading},data-detail=#{ui.accessHistory.detail},data-time=#{ui.accessHistory.time},data-event=#{ui.accessHistory.event},data-target=#{ui.accessHistory.target},data-actor=#{ui.accessHistory.actor},data-trace=#{ui.accessHistory.trace},data-roles=#{ui.ops.role},data-permissions=#{ui.accessHistory.permissions},data-mapping-count=#{ui.accessHistory.mappingCount},data-version=#{ui.ops.version},data-active=#{ui.accounts.active},data-deleted=#{ui.accessHistory.deleted},data-enabled=#{ui.accessHistory.enabled},data-name-vi=#{ui.foundation.nameVi},data-name-en=#{ui.foundation.nameEn},data-policy-kind=#{ui.accessHistory.policyKind},data-policy-target=#{ui.accessHistory.policyTarget},data-on=#{ui.monitoring.on},data-off=#{ui.monitoring.off}"
            ></div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
        <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
        <script th:src="@{/assets/js/access-tree.js}"></script>
        <script th:src="@{/assets/js/role-picker.js}"></script>
        <script th:src="@{/assets/js/operations.js}"></script>
        <script
            th:if="${accessAllowed}"
            th:src="@{/assets/js/access-management.js}"
        ></script>
        <script
            th:if="${adminUser}"
            th:src="@{/assets/js/access-history.js}"
        ></script>
    </body>
</html>
