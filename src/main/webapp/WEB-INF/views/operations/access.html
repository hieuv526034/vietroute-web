<!doctype html>
<html
    lang="vi"
    xmlns:th="http://www.thymeleaf.org"
    th:lang="${currentLocale}"
>
    <head th:replace="~{fragments/layout :: head(#{ui.grants.roles})}"></head>
    <body>
        <header th:replace="~{fragments/layout :: header}"></header>
        <nav th:replace="~{fragments/layout :: breadcrumbs}"></nav>
        <main
            class="container-xl py-5 operations-page"
            data-role-workspace
        >
            <div class="d-flex flex-wrap justify-content-between gap-3 align-items-center mb-3">
                <div>
                    <h1 th:text="#{ui.grants.roles}"></h1>
                    <div
                        th:replace="~{fragments/help :: guide('roles-guide', #{ui.grants.roles}, ${ {'ui.help.roles.use', 'ui.grants.note', 'ui.help.roles.selection', 'ui.help.roles.scope'} })}"
                    ></div>
                </div>
            </div>
            <p
                id="form-feedback"
                class="feedback"
                role="alert"
                hidden
            ></p>
            <div data-tabs>
                <div
                    class="workspace-tabs"
                    role="tablist"
                    th:attr="aria-label=#{ui.grants.roles}"
                >
                    <button
                        id="role-tab"
                        type="button"
                        data-tab-target="roles-panel"
                        th:text="#{ui.grants.roles}"
                    ></button>
                    <button
                        id="functions-tab"
                        type="button"
                        data-tab-target="functions-panel"
                        th:text="#{ui.functions.title}"
                    ></button>
                    <button
                        id="scopes-tab"
                        type="button"
                        data-tab-target="access-scopes-section"
                        th:text="#{ui.scope.title}"
                    ></button>
                </div>
                <section
                    id="roles-panel"
                    class="card p-4"
                >
                    <fieldset
                        id="roles-controls"
                        class="border-0 p-0 m-0"
                    >
                        <form
                            id="roles-search"
                            class="table-filter mb-3"
                        >
                            <div>
                                <label
                                    for="roles-query"
                                    th:text="#{ui.accessRoles.registrySearch}"
                                ></label>
                                <input
                                    id="roles-query"
                                    name="query"
                                    type="search"
                                    class="form-control"
                                    maxlength="160"
                                />
                            </div>
                            <button
                                type="submit"
                                class="button button-outline"
                                th:text="#{ui.ops.filter}"
                            ></button>
                            <button
                                id="roles-refresh"
                                type="button"
                                class="button button-outline"
                                th:text="#{ui.ops.refresh}"
                            ></button>
                            <button
                                id="role-create"
                                type="button"
                                class="button"
                                hidden
                                th:text="#{ui.foundation.newRole}"
                            ></button>
                        </form>
                        <p
                            id="roles-status"
                            role="status"
                            aria-live="polite"
                        ></p>
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th th:text="#{ui.foundation.code}"></th>
                                        <th th:text="#{ui.foundation.nameVi}"></th>
                                        <th th:text="#{ui.foundation.nameEn}"></th>
                                        <th th:text="#{ui.foundation.active}"></th>
                                        <th
                                            class="table-actions"
                                            th:text="#{ui.ops.actions}"
                                        ></th>
                                    </tr>
                                </thead>
                                <tbody id="roles-body"></tbody>
                            </table>
                        </div>
                        <nav th:replace="~{fragments/pagination :: pager('roles', 20)}"></nav>
                    </fieldset>
                </section>
                <section
                    id="functions-panel"
                    class="card p-4"
                    hidden
                >
                    <h2
                        class="h4"
                        th:text="#{ui.functions.title}"
                    ></h2>
                    <p th:text="#{ui.functions.note}"></p>
                    <p
                        id="functions-feedback"
                        class="feedback"
                        role="alert"
                        hidden
                    ></p>
                    <fieldset
                        id="functions-controls"
                        class="border-0 p-0 m-0"
                    >
                        <form
                            id="functions-filter"
                            class="table-filter mb-3"
                        >
                            <div>
                                <label
                                    for="functions-query"
                                    th:text="#{ui.functions.search}"
                                ></label>
                                <input
                                    id="functions-query"
                                    type="search"
                                    class="form-control"
                                    maxlength="160"
                                />
                            </div>
                            <button
                                class="button button-outline"
                                type="submit"
                                th:text="#{ui.ops.filter}"
                            ></button>
                            <button
                                id="functions-refresh"
                                class="button button-outline"
                                type="button"
                                th:text="#{ui.ops.refresh}"
                            ></button>
                            <button
                                id="function-create"
                                class="button"
                                type="button"
                                hidden
                                th:text="#{ui.functions.create}"
                            ></button>
                        </form>
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th th:text="#{ui.foundation.code}"></th>
                                        <th th:text="#{ui.foundation.nameVi}"></th>
                                        <th th:text="#{ui.foundation.nameEn}"></th>
                                        <th th:text="#{ui.foundation.active}"></th>
                                        <th th:text="#{ui.grants.resources}"></th>
                                        <th
                                            class="table-actions"
                                            th:text="#{ui.ops.actions}"
                                        ></th>
                                    </tr>
                                </thead>
                                <tbody id="functions-body"></tbody>
                            </table>
                        </div>
                        <nav th:replace="~{fragments/pagination :: pager('functions', 20)}"></nav>
                    </fieldset>
                </section>
                <section th:replace="~{fragments/access-advanced :: scopes}"></section>
            </div>
            <dialog
                id="role-dialog"
                class="workspace-dialog"
                aria-labelledby="role-dialog-title"
            >
                <div class="dialog-heading">
                    <h2
                        id="role-dialog-title"
                        class="h4"
                        th:text="#{ui.grants.roles}"
                    ></h2>
                    <button
                        type="button"
                        class="dialog-close"
                        data-dialog-close
                        th:attr="aria-label=#{ui.ops.close}"
                    >
                        ×
                    </button>
                </div>
                <form
                    id="role-form"
                    data-validate
                >
                    <fieldset class="dialog-controls border-0 p-0 m-0">
                        <label
                            for="role-code"
                            class="form-label"
                            th:text="#{ui.foundation.code}"
                        ></label>
                        <input
                            id="role-code"
                            name="code"
                            class="form-control"
                            pattern="[A-Z][A-Z0-9_]{1,23}"
                            maxlength="24"
                            required
                        />
                        <label
                            for="role-name-vi"
                            class="form-label"
                            th:text="#{ui.foundation.nameVi}"
                        ></label>
                        <input
                            id="role-name-vi"
                            name="nameVi"
                            class="form-control"
                            maxlength="120"
                            required
                        />
                        <label
                            for="role-name-en"
                            class="form-label"
                            th:text="#{ui.foundation.nameEn}"
                        ></label>
                        <input
                            id="role-name-en"
                            name="nameEn"
                            class="form-control"
                            maxlength="120"
                            required
                        />
                        <label class="d-flex gap-2 mt-3">
                            <input
                                id="role-active"
                                name="active"
                                type="checkbox"
                                class="form-check-input"
                            />
                            <span th:text="#{ui.foundation.active}"></span>
                        </label>
                        <p
                            id="role-feedback"
                            class="feedback"
                            role="alert"
                            hidden
                        ></p>
                        <div class="dialog-actions">
                            <button
                                type="button"
                                class="button button-outline"
                                data-dialog-close
                                th:text="#{ui.catalog.cancel}"
                            ></button>
                            <button
                                type="submit"
                                class="button"
                                th:text="#{ui.catalog.save}"
                            ></button>
                        </div>
                    </fieldset>
                </form>
            </dialog>
            <dialog
                id="grants-dialog"
                class="workspace-dialog workspace-dialog-wide"
                aria-labelledby="grants-title"
            >
                <div class="dialog-heading">
                    <h2
                        id="grants-title"
                        class="h4"
                        th:text="#{ui.grants.assign}"
                    ></h2>
                    <button
                        type="button"
                        class="dialog-close"
                        data-dialog-close
                        th:attr="aria-label=#{ui.ops.close}"
                    >
                        ×
                    </button>
                </div>
                <p
                    id="grants-target"
                    class="muted"
                ></p>
                <p th:text="#{ui.grants.note}"></p>
                <form id="grants-form">
                    <fieldset
                        id="grants-controls"
                        class="border-0 p-0 m-0"
                    >
                        <div class="resource-grant-content">
                            <label
                                for="grants-search"
                                class="form-label"
                                th:text="#{ui.grants.search}"
                            ></label>
                            <input
                                id="grants-search"
                                class="form-control"
                                type="search"
                                maxlength="160"
                            />
                            <p
                                id="grants-count"
                                role="status"
                                aria-live="polite"
                                class="muted"
                            ></p>
                            <div
                                id="grants-tree"
                                class="resource-grant-tree"
                            ></div>
                            <p
                                id="grants-changes"
                                class="access-tree-preview"
                                role="status"
                            ></p>
                            <p
                                id="grants-feedback"
                                class="feedback"
                                role="alert"
                                hidden
                            ></p>
                            <nav th:replace="~{fragments/pagination :: pager('function-grants', 20)}"></nav>
                        </div>
                        <div class="dialog-actions">
                            <button
                                type="button"
                                class="button button-outline"
                                data-dialog-close
                                th:text="#{ui.catalog.cancel}"
                            ></button>
                            <button
                                id="grants-save"
                                type="submit"
                                class="button"
                                th:text="#{ui.catalog.save}"
                            ></button>
                        </div>
                    </fieldset>
                </form>
            </dialog>
            <dialog
                id="function-dialog"
                class="workspace-dialog workspace-dialog-wide"
                aria-labelledby="function-dialog-title"
            >
                <div class="dialog-heading">
                    <h2
                        id="function-dialog-title"
                        class="h4"
                        th:text="#{ui.functions.edit}"
                    ></h2>
                    <button
                        type="button"
                        class="dialog-close"
                        data-dialog-close
                        th:attr="aria-label=#{ui.ops.close}"
                    >
                        ×
                    </button>
                </div>
                <form
                    id="function-form"
                    data-validate
                >
                    <fieldset
                        id="function-form-controls"
                        class="border-0 p-0 m-0"
                    >
                        <label
                            for="function-code"
                            class="form-label"
                            th:text="#{ui.foundation.code}"
                        ></label>
                        <input
                            id="function-code"
                            name="code"
                            class="form-control"
                            required
                            maxlength="80"
                            pattern="[A-Z][A-Za-z0-9_]{2,79}"
                        />
                        <label
                            for="function-name-vi"
                            class="form-label"
                            th:text="#{ui.foundation.nameVi}"
                        ></label>
                        <input
                            id="function-name-vi"
                            name="nameVi"
                            class="form-control"
                            required
                            maxlength="500"
                        />
                        <label
                            for="function-name-en"
                            class="form-label"
                            th:text="#{ui.foundation.nameEn}"
                        ></label>
                        <input
                            id="function-name-en"
                            name="nameEn"
                            class="form-control"
                            required
                            maxlength="500"
                        />
                        <label class="d-flex gap-2 mt-3">
                            <input
                                id="function-active"
                                name="active"
                                type="checkbox"
                                class="form-check-input"
                            />
                            <span th:text="#{ui.foundation.active}"></span>
                        </label>
                        <label
                            for="function-target-query"
                            class="form-label mt-3"
                            th:text="#{ui.grants.search}"
                        ></label>
                        <input
                            id="function-target-query"
                            type="search"
                            class="form-control"
                            maxlength="160"
                        />
                        <p
                            id="function-target-count"
                            role="status"
                            aria-live="polite"
                        ></p>
                        <div
                            id="function-target-options"
                            class="resource-grant-tree"
                        ></div>
                        <p
                            id="function-form-feedback"
                            class="feedback"
                            role="alert"
                            hidden
                        ></p>
                        <div class="dialog-actions">
                            <button
                                type="button"
                                class="button button-outline"
                                data-dialog-close
                                th:text="#{ui.catalog.cancel}"
                            ></button>
                            <button
                                type="submit"
                                class="button"
                                th:text="#{ui.catalog.save}"
                            ></button>
                        </div>
                    </fieldset>
                </form>
            </dialog>
            <dialog th:replace="~{fragments/access-advanced :: scopeDialog}"></dialog>
            <dialog th:replace="~{fragments/access-advanced :: membersDialog}"></dialog>
            <dialog th:replace="~{fragments/access-advanced :: memberDialog}"></dialog>
            <div th:replace="~{fragments/access-advanced :: scopeLabels}"></div>
            <div
                id="grants-labels"
                hidden
                th:attr="data-functions=#{ui.functions.title},data-delete-function=#{ui.functions.delete},data-confirm-function=#{ui.functions.confirm},data-open-menu=#{ui.grants.openMenu},data-edit=#{ui.foundation.edit},data-assign=#{ui.grants.assign},data-delete=#{ui.foundation.deleteRole},data-confirm=#{ui.foundation.confirmRole},data-on=#{ui.monitoring.on},data-off=#{ui.monitoring.off},data-empty=#{ui.foundation.empty},data-public=#{ui.grants.public},data-self=#{ui.grants.self},data-admin=#{ui.grants.admin},data-menu=#{ui.accessResources.menu},data-api=#{ui.accessResources.api},data-selected=#{ui.grants.selected},data-added=#{ui.accessTree.added},data-removed=#{ui.accessTree.removed},data-loading=#{ui.ops.loading},data-success=#{ui.accounts.success},data-conflict=#{ui.accounts.conflict},data-stale=#{ui.grants.stale},data-readonly=#{ui.grants.readonly}"
            ></div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
        <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
        <script th:src="@{/assets/js/function-selection.js}"></script>
        <script th:src="@{/assets/js/functions.js}"></script>
        <script th:src="@{/assets/js/roles.js}"></script>
        <script th:src="@{/assets/js/role-picker.js}"></script>

        <script th:src="@{/assets/js/data-scopes.js}"></script>
    </body>
</html>
