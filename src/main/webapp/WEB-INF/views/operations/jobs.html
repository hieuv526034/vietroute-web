<!doctype html>
<html
    lang="vi"
    xmlns:th="http://www.thymeleaf.org"
    th:lang="${currentLocale}"
>
    <head th:replace="~{fragments/layout :: head(#{ui.ops.jobs})}"></head>
    <body>
        <header th:replace="~{fragments/layout :: header}"></header>
        <nav th:replace="~{fragments/layout :: breadcrumbs}"></nav>
        <main
            class="container-xl py-5 operations-page"
            data-operations="jobs"
        >
            <div class="d-flex flex-wrap justify-content-between gap-3 align-items-center mb-3">
                <h1 th:text="#{ui.ops.jobs}"></h1>
                <button
                    class="button button-outline"
                    type="button"
                    id="ops-refresh"
                    th:text="#{ui.ops.refresh}"
                ></button>
            </div>
            <p
                class="text-secondary"
                th:text="#{ui.ops.jobsNote}"
            ></p>
            <p
                id="form-feedback"
                class="feedback"
                role="alert"
                hidden
            ></p>
            <p
                id="ops-status"
                role="status"
                aria-live="polite"
            ></p>
            <fieldset
                id="ops-controls"
                class="border-0 p-0 m-0 w-100"
            >
                <form
                    id="jobs-filter"
                    class="table-filter mb-4"
                >
                    <div>
                        <label
                            for="job-status"
                            class="form-label"
                            th:text="#{ui.ops.status}"
                        ></label>
                        <select
                            id="job-status"
                            class="form-select"
                        >
                            <option
                                value=""
                                th:text="#{ui.ops.all}"
                            ></option>
                            <option>QUEUED</option>
                            <option>RUNNING</option>
                            <option>SUCCEEDED</option>
                            <option>DEAD</option>
                        </select>
                    </div>
                    <button
                        class="button"
                        type="submit"
                        th:text="#{ui.ops.filter}"
                    ></button>
                </form>
                <div
                    class="table-responsive"
                    tabindex="0"
                    role="region"
                    th:attr="aria-label=#{ui.table.scroll}"
                >
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th th:text="#{ui.ops.type}"></th>
                                <th th:text="#{ui.ops.status}"></th>
                                <th th:text="#{ui.ops.attempts}"></th>
                                <th th:text="#{ui.ops.updatedAt}"></th>
                                <th
                                    class="table-actions"
                                    th:text="#{ui.ops.actions}"
                                ></th>
                            </tr>
                        </thead>
                        <tbody id="jobs-body"></tbody>
                    </table>
                </div>
                <div th:replace="~{fragments/pagination :: pager('jobs', 20)}"></div>
                <dialog
                    id="job-dialog"
                    class="operations-dialog workspace-dialog workspace-dialog-wide"
                    aria-labelledby="job-detail-title"
                >
                    <p
                        id="job-feedback"
                        class="feedback"
                        role="alert"
                        hidden
                    ></p>
                    <div class="d-flex justify-content-between gap-4 mb-3">
                        <h2
                            id="job-detail-title"
                            class="h4"
                            th:text="#{ui.ops.jobDetails}"
                        ></h2>
                        <button
                            id="job-close"
                            class="dialog-close"
                            type="button"
                            th:attr="aria-label=#{ui.ops.close}"
                        >
                            <span aria-hidden="true">×</span>
                        </button>
                    </div>
                    <dl
                        id="job-details"
                        class="operations-details"
                        th:attr="data-id='ID',data-type=#{ui.ops.type},data-status=#{ui.ops.status},data-attempts=#{ui.ops.attempts},data-available-at=#{ui.ops.availableAt},data-locked-until=#{ui.ops.lockedUntil},data-last-error-code=#{ui.ops.errorCode},data-finished-at=#{ui.ops.finishedAt},data-created-at=#{ui.ops.createdAt},data-updated-at=#{ui.ops.updatedAt},data-created-by=#{ui.ops.createdBy},data-updated-by=#{ui.ops.updatedBy},data-version=#{ui.ops.version}"
                    ></dl>
                    <p
                        th:text="#{ui.ops.retryNote}"
                        class="text-secondary"
                    ></p>
                    <div class="dialog-actions">
                        <button
                            id="job-retry"
                            type="button"
                            class="button"
                            disabled
                            th:text="#{ui.ops.retry}"
                        ></button>
                    </div>
                </dialog>
            </fieldset>
            <div
                id="ops-labels"
                hidden
                th:attr="data-empty=#{ui.ops.empty},data-loading=#{ui.ops.loading},data-saved=#{ui.ops.saved},data-confirm-retry=#{ui.ops.confirmRetry},data-confirm-permissions=#{ui.ops.confirmPermissions},data-confirm-roles=#{ui.ops.confirmRoles},data-details=#{ui.ops.details},data-retry=#{ui.ops.retry},data-select=#{ui.ops.select},data-on=#{ui.monitoring.on},data-off=#{ui.monitoring.off},data-page=#{ui.ops.page},data-fixed=#{ui.ops.fixed},data-readonly=#{ui.ops.readonly},data-restricted=#{ui.ops.restricted},data-self=#{ui.ops.self},data-conflict=#{ui.ops.conflict}"
            ></div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
        <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
        <script th:src="@{/assets/js/operations.js}"></script>
    </body>
</html>
