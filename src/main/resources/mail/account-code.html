<!doctype html>
<html
    xmlns:th="http://www.thymeleaf.org"
    lang="vi"
    th:lang="${language}"
>
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <meta
            name="color-scheme"
            content="light"
        />
        <title th:text="${subject}">VietRoute</title>
    </head>
    <body
        style="
            margin: 0;
            padding: 0;
            background-color: #f1f5f4;
            color: #19372e;
            font-family: Arial, Helvetica, sans-serif;
        "
    >
        <div
            style="display: none; max-height: 0; overflow: hidden; opacity: 0; mso-hide: all"
            th:text="${intro}"
        ></div>
        <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="background-color: #f1f5f4"
        >
            <tr>
                <td
                    align="center"
                    style="padding: 32px 12px"
                >
                    <!-- Bảng/inline CSS và chiều rộng co giãn để email không phụ thuộc CSS/JS của website. -->
                    <!--[if mso]><table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"><tr><td><![endif]-->
                    <table
                        role="presentation"
                        width="100%"
                        cellspacing="0"
                        cellpadding="0"
                        border="0"
                        style="max-width: 600px; table-layout: fixed"
                    >
                        <tr>
                            <td style="padding: 28px 24px; background-color: #123e32; border-radius: 18px 18px 0 0">
                                <p
                                    style="
                                        margin: 0;
                                        color: #ffffff;
                                        font-size: 28px;
                                        font-weight: 700;
                                        letter-spacing: -1px;
                                    "
                                >
                                    VietRoute
                                </p>
                                <p
                                    style="margin: 8px 0 0; color: #d2e5db; font-size: 13px; line-height: 20px"
                                    th:text="${caption}"
                                ></p>
                            </td>
                        </tr>
                        <tr>
                            <td
                                style="
                                    padding: 32px 24px;
                                    background-color: #ffffff;
                                    border: 1px solid #dce6df;
                                    border-top: 4px solid #b6e9a9;
                                    border-radius: 0 0 18px 18px;
                                "
                            >
                                <p
                                    style="
                                        margin: 0 0 14px;
                                        color: #427058;
                                        font-size: 11px;
                                        font-weight: 700;
                                        letter-spacing: 2px;
                                        text-transform: uppercase;
                                    "
                                    th:text="${eyebrow}"
                                ></p>
                                <h1
                                    style="
                                        margin: 0 0 16px;
                                        color: #153e30;
                                        font-size: 28px;
                                        line-height: 36px;
                                        letter-spacing: -0.6px;
                                    "
                                    th:text="${heading}"
                                ></h1>
                                <p
                                    style="margin: 0 0 26px; color: #52665e; font-size: 15px; line-height: 25px"
                                    th:text="${intro}"
                                ></p>
                                <table
                                    role="presentation"
                                    width="100%"
                                    cellspacing="0"
                                    cellpadding="0"
                                    border="0"
                                    style="
                                        table-layout: fixed;
                                        background-color: #eff7f0;
                                        border: 1px solid #cde1ce;
                                        border-radius: 12px;
                                    "
                                >
                                    <tr>
                                        <td style="padding: 20px">
                                            <p
                                                style="
                                                    margin: 0 0 12px;
                                                    color: #526e5b;
                                                    font-size: 11px;
                                                    line-height: 18px;
                                                    font-weight: 700;
                                                    letter-spacing: 1px;
                                                    text-transform: uppercase;
                                                "
                                                th:text="${codeLabel}"
                                            ></p>
                                            <p
                                                style="
                                                    margin: 0;
                                                    color: #143d29;
                                                    font-family: Consolas, 'Courier New', monospace;
                                                    font-size: 20px;
                                                    font-weight: 700;
                                                    line-height: 30px;
                                                    word-break: break-all;
                                                    overflow-wrap: anywhere;
                                                "
                                                th:text="${code}"
                                            ></p>
                                            <p
                                                style="
                                                    margin: 14px 0 0;
                                                    color: #526e5b;
                                                    font-size: 12px;
                                                    line-height: 20px;
                                                "
                                                th:text="${expiry}"
                                            ></p>
                                        </td>
                                    </tr>
                                </table>
                                <p
                                    style="margin: 22px 0 0; color: #52665e; font-size: 14px; line-height: 24px"
                                    th:text="${instructions}"
                                ></p>
                                <p
                                    style="
                                        margin: 24px 0 0;
                                        padding-top: 20px;
                                        border-top: 1px solid #e8eeea;
                                        color: #728078;
                                        font-size: 12px;
                                        line-height: 21px;
                                    "
                                    th:text="${notice}"
                                ></p>
                            </td>
                        </tr>
                        <tr>
                            <td
                                align="center"
                                style="padding: 22px 18px 4px; color: #7b8980; font-size: 11px; line-height: 19px"
                                th:text="${footer}"
                            ></td>
                        </tr>
                    </table>
                    <!--[if mso]></td></tr></table><![endif]-->
                </td>
            </tr>
        </table>
    </body>
</html>
