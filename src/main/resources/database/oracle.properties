# Oracle Database 26ai JDBC Thin: host:port/SERVICE_NAME cua PDB, khong phai SID.
# FREEPDB1 chi la vi du local; thay bang service do DBA cung cap.
# Moi chuan bi ket noi; runtime chan den khi co migration/query/regression Oracle.
# Schema Oracle thong thuong viet HOA va da duoc DBA tao, ung dung khong tao user/PDB.
db.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
db.username=VIETROUTE_APP
# Local fallback trong; VIETROUTE_DB_PASSWORD tu OS/IDE/.env uu tien. Khong dien secret vao classpath.
db.password=
db.schema=VIETROUTE_APP
