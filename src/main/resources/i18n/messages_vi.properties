ui.ops.userRolesNote=Chỉ ADMIN có ACCESS_READ được tra tài khoản; gán role cần thêm ACCESS_ASSIGN/ACCESS_WRITE. Không tự sửa role, không bỏ admin cuối. Trang này chưa cấp tài khoản mới hoặc quản lý nhà xe.
ui.ops.configNote=Thông số không nhạy cảm của instance đang trả lời, đọc từ Settings lúc startup. Không phải trang sửa cấu hình runtime.
