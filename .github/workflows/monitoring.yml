name: Monitoring configuration

on:
  pull_request:
    paths:
      - 'ops/monitoring/**'
      - '.github/workflows/monitoring.yml'
  push:
    branches: [main]
    paths:
      - 'ops/monitoring/**'
      - '.github/workflows/monitoring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoring:
    name: Validate dashboards and alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Prometheus rules and simulated failures
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/promtool -v "$PWD/ops/monitoring:/work:ro" prom/prometheus:v3.15.1 check rules /work/alerts.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/ops/monitoring:/work:ro" -w /work prom/prometheus:v3.15.1 test rules alerts.test.yml
      - name: Validate Grafana dashboard JSON
        run: |
          jq -e '.schemaVersion >= 39 and (.panels | length >= 8)' ops/monitoring/dashboard.json
