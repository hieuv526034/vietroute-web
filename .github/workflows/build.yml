name: Production Docker

on:
  push:
    branches: [main]
    paths: &build-paths
      - 'src/main/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'render.yaml'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths: *build-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    name: Build and check production container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require promotion from dev for production pull requests
        if: github.event_name == 'pull_request' && (github.head_ref != 'dev' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo 'Production chỉ nhận PR từ dev sau yêu cầu phát hành của chủ dự án.' >&2
          exit 1
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Java and business transactions with isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name vietroute-business-tests \
            -p 127.0.0.1:15439:5432 -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_USER=ciadmin -e POSTGRES_DB=vietroute_business_test postgres:17-alpine
          for attempt in {1..30}; do
            if docker exec vietroute-business-tests pg_isready -U ciadmin -d vietroute_business_test; then break; fi
            sleep 1
          done
          sh ./mvnw verify -Dbusiness.test.database=jdbc:postgresql://127.0.0.1:15439/vietroute_business_test
      - uses: docker/setup-buildx-action@v3
      - name: Build production image with cached Maven and Docker layers
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vietroute-web:ci
          cache-from: type=gha,scope=vietroute-production
          cache-to: type=gha,mode=max,scope=vietroute-production
      - name: Check Tomcat startup, home page and static assets
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name vietroute-ci \
            --memory 512m -e PORT=10001 -p 127.0.0.1:18080:10001 vietroute-web:ci
          curl --fail --silent --show-error --retry 40 --retry-delay 2 \
            --retry-connrefused --retry-all-errors --max-time 5 \
            --output "$RUNNER_TEMP/health.txt" http://127.0.0.1:18080/health
          grep -Fx 'vietroute-web: UP' "$RUNNER_TEMP/health.txt"
          curl --fail --silent --show-error --output "$RUNNER_TEMP/home.html" http://127.0.0.1:18080/
          grep -q 'VietRoute' "$RUNNER_TEMP/home.html"
          curl --fail --silent --show-error --output "$RUNNER_TEMP/app.css" http://127.0.0.1:18080/assets/css/app.css
          grep -q '\.features' "$RUNNER_TEMP/app.css"
      - name: Verify WAR excludes test dependencies and local credentials
        shell: bash
        run: |
          set -euo pipefail
          docker cp vietroute-ci:/usr/local/tomcat/webapps/ROOT.war "$RUNNER_TEMP/production.war"
          unzip -Z -1 "$RUNNER_TEMP/production.war" > "$RUNNER_TEMP/war-contents.txt"
          if grep -Ei '(junit|spring-test|mysql-connector|test-classes|tomcat-embed|vn/vietroute/dev/|(^|/)\.env($|/)|Test\.class$)' "$RUNNER_TEMP/war-contents.txt"; then
            echo 'Production WAR contains unexpected test/development files' >&2
            exit 1
          fi
          grep -q 'WEB-INF/lib/postgresql-' "$RUNNER_TEMP/war-contents.txt"
          grep -q 'WEB-INF/lib/cloudinary-http5-' "$RUNNER_TEMP/war-contents.txt"
      - name: Verify bootstrap and JWT flows with isolated PostgreSQL
        shell: bash
        run: bash .github/scripts/verify-auth.sh
      - name: Show container logs on failure
        if: failure()
        run: |
          for container in vietroute-ci vietroute-auth-ci vietroute-auth-ci2 vietroute-pooler-ci vietroute-recovery-ci vietroute-db-ci vietroute-redis-ci; do
            docker logs "$container" || true
          done
      - name: Remove CI container
        if: always()
        run: |
          docker rm --force vietroute-ci vietroute-auth-ci vietroute-auth-ci2 vietroute-pooler-ci vietroute-recovery-ci vietroute-db-ci vietroute-redis-ci vietroute-business-tests || true
          docker network rm vietroute-auth-net || true
