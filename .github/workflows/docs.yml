name: Documentation

on:
  pull_request:
    branches: [dev, main]
    paths: &docs-paths
      - '**/*.md'
      - 'docs/**'
      - '.cursor/rules/**'
      - 'scripts/development/**'
      - 'src/test/resources/dev/repository.test.cjs'
      - '.github/workflows/docs.yml'
  push:
    branches: [dev, main]
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Validate internal documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check tracked Markdown, images and documentation index without app build
        run: node scripts/development/check-repository.cjs --docs
